<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIAC_Editor</title>
<style>
:root {
  --bg: #1e1e1e; --panel: #252526; --hrana: #3a3a3a; --text: #f0f0f0; --tlum: #a8a8a8;
  --akcent: #00D7FF; --vodic: #8A8A8A; --varovani: #fb923c; --vyber: #0e3a47;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #ffffff; --panel: #f3f3f3; --hrana: #d0d0d0; --text: #111111; --tlum: #555555;
    --akcent: #0a7ea4; --vodic: #4a4a4a; --varovani: #c2410c; --vyber: #d6f1fa;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #ffffff; --panel: #f3f3f3; --hrana: #d0d0d0; --text: #111111; --tlum: #555555;
  --akcent: #0a7ea4; --vodic: #4a4a4a; --varovani: #c2410c; --vyber: #d6f1fa;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, sans-serif;
       display: grid; grid-template-rows: auto 1fr; }
header { display: flex; gap: 16px; align-items: baseline; padding: 8px 16px; border-bottom: 1px solid var(--hrana);
         background: var(--panel); }
header b { color: var(--akcent); font-size: 15px; }
header .info { color: var(--tlum); }
.hlavni { display: grid; grid-template-columns: 280px 1fr; min-height: 0; }
aside { border-right: 1px solid var(--hrana); overflow: auto; background: var(--panel); }
aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--tlum); margin: 12px 12px 6px; }
aside a { display: block; padding: 5px 12px; color: var(--text); text-decoration: none; border-left: 3px solid transparent;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
aside a:hover { background: var(--vyber); }
aside a.akt { border-left-color: var(--akcent); background: var(--vyber); }
aside a .c { color: var(--akcent); font-family: Consolas, monospace; margin-right: 6px; }
aside a .j { color: var(--tlum); font-size: 11px; margin-left: 4px; }
main { overflow: auto; padding: 14px 18px; min-width: 0; }
h1 { font-size: 16px; margin: 0 0 4px; font-weight: 600; }
h1 .c { color: var(--akcent); font-family: Consolas, monospace; }
.komentar { color: var(--tlum); margin: 0 0 8px; white-space: pre-wrap; }
.varovani { color: var(--varovani); border: 1px solid var(--varovani); padding: 6px 10px; border-radius: 4px; margin: 8px 0; }
.platno { overflow: auto; border: 1px solid var(--hrana); border-radius: 4px; background: var(--bg); padding: 6px 0; }
svg text { font: 12px Consolas, "DejaVu Sans Mono", monospace; fill: var(--text); }
svg .pin { font-size: 11px; fill: var(--tlum); }
svg .titul { font-weight: bold; fill: var(--akcent); }
svg .prazdny { fill: var(--tlum); }
svg .vod { stroke: var(--vodic); stroke-width: 1.5; fill: none; }
svg .lista { stroke: var(--akcent); stroke-width: 4; }
svg .prv { stroke: var(--akcent); stroke-width: 2; fill: none; }
svg .box { stroke: var(--akcent); stroke-width: 1.5; fill: var(--bg); }
svg .maska { fill: var(--bg); stroke: none; }
svg .neg { fill: var(--bg); stroke-width: 1.5; }
svg .uzel { fill: var(--vodic); stroke: none; }
svg .hit-pin { fill: transparent; cursor: pointer; }
.postup ol { margin: 4px 0 8px; padding-left: 22px; font-size: 13px; }
.postup li { margin: 3px 0; }
.postup code { font: 12px Consolas, monospace; color: var(--akcent); }
.postup h3 { display: flex; gap: 10px; align-items: center; }
.postup button { font: inherit; font-size: 12px; padding: 1px 9px; border-radius: 4px; border: 1px solid var(--hrana);
                 background: var(--panel); color: var(--text); cursor: pointer; text-transform: none; letter-spacing: 0; }
.chyby .var { color: var(--tlum); }
svg g.d-zmeneny text.beze-zmeny { fill: var(--text); font-weight: normal; }   /* FBD: u změněného boxu jen změněné piny */
pre, .rungy { font: 12px/1.6 Consolas, monospace; white-space: pre-wrap; }
.rungy div { border-bottom: 1px dashed var(--hrana); padding: 2px 0; }
ul.vyber { list-style: none; padding: 0; columns: 3 220px; }
ul.vyber a { color: var(--text); }
/* M2: rozdíl a stavy */
:root { --pridany: #4ade80; --zmeneny: #fb923c; --smazany: #f87171;
        --s-Proposal: #a8a8a8; --s-Approved: #00D7FF; --s-Signed: #c084fc; --s-Uploaded: #facc15; --s-Tested: #4ade80; }
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --pridany: #15803d; --zmeneny: #c2410c; --smazany: #b91c1c;
    --s-Proposal: #6b7280; --s-Approved: #0a7ea4; --s-Signed: #7e22ce; --s-Uploaded: #a16207; --s-Tested: #15803d; }
}
:root[data-theme="light"] { --pridany: #15803d; --zmeneny: #c2410c; --smazany: #b91c1c;
  --s-Proposal: #6b7280; --s-Approved: #0a7ea4; --s-Signed: #7e22ce; --s-Uploaded: #a16207; --s-Tested: #15803d; }
svg g.d-pridany .prv, svg g.d-pridany .box { stroke: var(--pridany); stroke-width: 2.5; }
svg g.d-pridany text, svg g.d-pridany .titul { fill: var(--pridany); font-weight: bold; }
svg g.d-zmeneny .prv, svg g.d-zmeneny .box { stroke: var(--zmeneny); stroke-width: 2.5; }
svg g.d-zmeneny text, svg g.d-zmeneny .titul { fill: var(--zmeneny); font-weight: bold; }
svg g.d-smazany .prv, svg g.d-smazany .box { stroke: var(--smazany); stroke-width: 2.5; stroke-dasharray: 3 2; }
svg g.d-smazany text, svg g.d-smazany .titul { fill: var(--smazany); text-decoration: line-through; }
.strom { padding-bottom: 6px; border-bottom: 1px solid var(--hrana); }
.strom .u0, .strom .u1, .strom .u2 { padding: 3px 12px; color: var(--tlum); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strom .u0 { color: var(--text); font-weight: 600; }
.strom .u1 { padding-left: 22px; }
.strom .u2 { padding-left: 32px; }
.strom a.u3 { padding-left: 42px; font-size: 13px; }
.strom a.u4 { padding-left: 54px; font-size: 13px; }
.strom .prazdno { padding: 3px 12px; color: var(--tlum); font-size: 12px; margin: 0; }
.stav { display: inline-block; padding: 0 7px; border-radius: 9px; font-size: 11px; font-weight: 600; margin: 0 6px;
        border: 1px solid var(--sc); color: var(--sc); }
.s-Proposal { --sc: var(--s-Proposal); } .s-Approved { --sc: var(--s-Approved); } .s-Signed { --sc: var(--s-Signed); }
.s-Uploaded { --sc: var(--s-Uploaded); } .s-Tested { --sc: var(--s-Tested); }
.hlavicka { color: var(--tlum); margin: 2px 0 8px; }
.hlavicka b { color: var(--text); font-weight: 600; }
.tlacitka { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
.tlacitka button { font: inherit; padding: 5px 14px; border-radius: 4px; border: 1px solid var(--akcent); background: transparent;
                   color: var(--akcent); cursor: pointer; }
.tlacitka button.vpred { background: var(--akcent); color: var(--bg); font-weight: 600; }
.tlacitka button:disabled { border-color: var(--hrana); background: transparent; color: var(--tlum); cursor: not-allowed; }
.kontroly { font-size: 13px; margin: 6px 0 10px; }
.kontroly h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--tlum); margin: 0 0 4px; }
.kontroly .ok { color: var(--pridany); } .kontroly .ne { color: var(--smazany); }
.legenda { font-size: 12px; color: var(--tlum); margin: 4px 0; display: flex; gap: 14px; }
.legenda span::before { content: '■ '; } .legenda .p { color: var(--pridany); } .legenda .z { color: var(--zmeneny); }
.legenda .s { color: var(--smazany); }
/* M3: editor */
.hlavni.edit { grid-template-columns: 280px 1fr 250px; }
#paleta { border-left: 1px solid var(--hrana); border-right: 0; }
#paleta input { width: calc(100% - 24px); margin: 4px 12px 6px; font: inherit; padding: 4px 8px; background: var(--bg);
                color: var(--text); border: 1px solid var(--hrana); border-radius: 4px; }
#paleta .pol { display: flex; gap: 8px; align-items: baseline; padding: 4px 12px; cursor: grab; border-left: 3px solid transparent;
               white-space: nowrap; overflow: hidden; }
#paleta .pol:hover { background: var(--vyber); }
#paleta .pol.akt { border-left-color: var(--akcent); background: var(--vyber); }
#paleta .pol b { font: 600 12px Consolas, monospace; color: var(--akcent); min-width: 64px; }
#paleta .pol span { color: var(--tlum); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
.nastroje { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
.nastroje button { font: inherit; font-size: 13px; padding: 4px 11px; border-radius: 4px; border: 1px solid var(--hrana);
                   background: var(--panel); color: var(--text); cursor: pointer; }
.nastroje button:hover:not(:disabled) { border-color: var(--akcent); }
.nastroje button.akt { border-color: var(--akcent); color: var(--akcent); }
.nastroje button.hl { background: var(--akcent); color: var(--bg); border-color: var(--akcent); font-weight: 600; }
.nastroje button:disabled { color: var(--tlum); cursor: not-allowed; }
.nastroje input { font: inherit; font-size: 13px; padding: 3px 8px; width: 110px; background: var(--bg); color: var(--text);
                  border: 1px solid var(--hrana); border-radius: 4px; }
.rezim { color: var(--akcent); font-size: 13px; min-height: 19px; }
.rezim.zprava { color: var(--pridany); }
svg .misto { fill: var(--akcent); fill-opacity: .25; stroke: var(--akcent); stroke-width: 2; cursor: pointer; }
svg .misto:hover, svg .misto.blizko { fill-opacity: .9; }
svg .misto.zvolene { fill: var(--zmeneny); stroke: var(--zmeneny); fill-opacity: .9; }
svg .hit { fill: transparent; cursor: pointer; }
svg .ram-vyber { fill: var(--akcent); fill-opacity: .10; stroke: var(--akcent); stroke-width: 1.5; stroke-dasharray: 4 3; }
svg .ram-chyba { fill: none; stroke: var(--varovani); stroke-width: 2; }
.editor-spod { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(300px, 1.2fr); gap: 16px; margin-top: 10px; }
.editor-spod h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--tlum); margin: 0 0 6px; }
.chyby div { color: var(--varovani); padding: 3px 0; cursor: pointer; font-size: 13px; }
.chyby .ok { color: var(--pridany); cursor: default; }
.editor-spod > div { min-width: 0; }
.vlastnosti table { border-collapse: collapse; width: 100%; font-size: 13px; table-layout: fixed; }
.vlastnosti td { padding: 2px 6px 2px 0; }
.vlastnosti td:first-child { color: var(--tlum); font-family: Consolas, monospace; white-space: nowrap; width: 96px; overflow: hidden; text-overflow: ellipsis; }
.vlastnosti input, .vlastnosti select { width: 100%; font: 13px Consolas, monospace; padding: 3px 6px; background: var(--bg);
                    color: var(--text); border: 1px solid var(--hrana); border-radius: 3px; }
.vlastnosti input:focus { border-color: var(--akcent); outline: none; }
.vlastnosti .sekce td { color: var(--akcent); font-family: inherit; padding-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: auto; }
.znacka-chyb { color: var(--varovani); font-weight: 600; margin-left: 8px; }
</style>
</head>
<body>
<header><b>TIAC_Editor</b><span class="info" id="info">prohlížeč a úpravy</span></header>
<div class="hlavni">
  <aside id="nw"></aside>
  <main id="obsah"></main>
  <aside id="paleta" hidden></aside>
</div>
<datalist id="operandy"></datalist>
<script>
'use strict';
const q = new URLSearchParams(location.search);
if (q.get('tema') === 'svetly') document.documentElement.dataset.theme = 'light';
if (q.get('tema') === 'tmavy') document.documentElement.dataset.theme = 'dark';
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const L = 18, MAXZN = 30;

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }
async function api(cesta) {
  const r = await fetch(cesta);
  const j = await r.json();
  if (!r.ok) throw new Error(j.chyba || r.status);
  return j;
}
function odkaz(par) {
  const u = new URLSearchParams(q);
  for (const [k, v] of Object.entries(par)) v == null ? u.delete(k) : u.set(k, v);
  return '?' + u.toString();
}

// ---------- SVG ----------
function el(rodic, jm, attrs, text) {
  const e = document.createElementNS(NS, jm);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  rodic.appendChild(e);
  return e;
}
function popis(g, x, y, s, kotva, trida) {
  const prazdny = !s;
  let t = prazdny ? '...' : s;
  const zkr = t.length > MAXZN ? t.slice(0, MAXZN - 1) + '…' : t;
  const e = el(g, 'text', {x, y, 'text-anchor': kotva || 'middle', class: (trida || '') + (prazdny ? ' prazdny' : '')}, zkr);
  if (zkr !== t) el(e, 'title', {}, t);
  return e;
}
function kontakt(g, d, p) {
  const {cx, y} = d;
  el(g, 'rect', {class: 'maska', x: cx - 8, y: y - 10, width: 16, height: 20});
  el(g, 'line', {class: 'prv', x1: cx - 7, y1: y - 9, x2: cx - 7, y2: y + 9});
  el(g, 'line', {class: 'prv', x1: cx + 7, y1: y - 9, x2: cx + 7, y2: y + 9});
  if (p.typ === 'kontakt_nc') el(g, 'line', {class: 'prv', x1: cx - 4, y1: y + 7, x2: cx + 4, y2: y - 7});
  if (p.typ === 'kontakt_p' || p.typ === 'kontakt_n') {
    el(g, 'text', {x: cx, y: y + 4, 'text-anchor': 'middle', class: 'titul'}, p.typ === 'kontakt_p' ? 'P' : 'N');
    popis(g, cx, y + L + 4, p.bit);
  }
  popis(g, cx, y - 13, p.operand);
}
function civka(g, d, p) {
  const {cx, y} = d;
  el(g, 'rect', {class: 'maska', x: cx - 9, y: y - 10, width: 18, height: 20});
  el(g, 'path', {class: 'prv', d: `M${cx - 4} ${y - 9} A 13 13 0 0 0 ${cx - 4} ${y + 9}`});
  el(g, 'path', {class: 'prv', d: `M${cx + 4} ${y - 9} A 13 13 0 0 1 ${cx + 4} ${y + 9}`});
  const zn = {civka_s: 'S', civka_r: 'R', civka_p: 'P', civka_n: 'N'}[p.typ];
  if (zn) el(g, 'text', {x: cx, y: y + 4, 'text-anchor': 'middle', class: 'titul'}, zn);
  if (p.typ === 'civka_neg') el(g, 'line', {class: 'prv', x1: cx - 3, y1: y + 6, x2: cx + 3, y2: y - 6});
  if (p.typ === 'ret') {
    el(g, 'rect', {class: 'maska', x: cx - 16, y: y - 8, width: 32, height: 16});
    el(g, 'text', {x: cx, y: y + 4, 'text-anchor': 'middle', class: 'titul'}, 'RET');
    if (p.operand) popis(g, cx, y - 13, p.operand);
    return;
  }
  popis(g, cx, y - 13, p.operand);
}
function porovnani(g, d, p) {
  const {cx, y} = d;
  el(g, 'rect', {class: 'maska', x: cx - 16, y: y - 10, width: 32, height: 20});
  el(g, 'line', {class: 'prv', x1: cx - 15, y1: y - 9, x2: cx - 15, y2: y + 9});
  el(g, 'line', {class: 'prv', x1: cx + 15, y1: y - 9, x2: cx + 15, y2: y + 9});
  el(g, 'text', {x: cx, y: y + 4, 'text-anchor': 'middle', class: 'titul'}, p.op);
  popis(g, cx, y - 13, p.in1);
  if (p.sablona) el(g, 'text', {x: cx, y: y + L + 4, 'text-anchor': 'middle', class: 'pin'}, p.sablona);
  popis(g, cx, y + L * (p.sablona ? 2 : 1) + 4, p.in2);
}
function negace(g, d) {
  const {cx, y} = d;
  el(g, 'rect', {class: 'maska', x: cx - 16, y: y - 10, width: 32, height: 20});
  el(g, 'line', {class: 'prv', x1: cx - 15, y1: y - 9, x2: cx - 15, y2: y + 9});
  el(g, 'line', {class: 'prv', x1: cx + 15, y1: y - 9, x2: cx + 15, y2: y + 9});
  el(g, 'text', {x: cx, y: y + 4, 'text-anchor': 'middle', class: 'titul'}, 'NOT');
}
function box(g, d, p) {
  const {bx, bw, y_hl, radky, radky_r} = d;
  const top = y_hl - 13, spodek = Math.max(...radky, ...radky_r) + 11;
  el(g, 'rect', {class: 'box', x: bx, y: top, width: bw, height: spodek - top, rx: 2});
  el(g, 'text', {x: bx + bw / 2, y: y_hl + 4, 'text-anchor': 'middle', class: 'titul'}, p.nazev || '');
  if (p.sablona) el(g, 'text', {x: bx + bw / 2, y: y_hl + L + 4, 'text-anchor': 'middle', class: 'pin'}, p.sablona);
  if (p.instance) popis(g, bx + bw / 2, top - 6, p.instance);
  // vstupy: [napájení, ...vstupy]
  [{pin: p.napajeni[0], operand: null}, ...p.vstupy].forEach((pin, i) => {
    const yy = radky[i];
    const privod = String(pin.operand).startsWith('wire#');   // přívod: vodič vede až z buňky vlevo
    if (i > 0) el(g, 'line', {class: 'vod', x1: privod ? d.x : bx - 12, y1: yy, x2: bx, y2: yy});
    if (pin.pin) el(g, 'text', {x: bx + 5, y: yy + 4, class: 'pin'}, pin.pin);
    if (i > 0 && !privod) popis(g, bx - 15, yy + 4, pin.operand, 'end');
  });
  [{pin: p.napajeni[1], operand: null}, ...p.vystupy].forEach((pin, i) => {
    const yy = radky_r[i];
    if (i > 0) el(g, 'line', {class: 'vod', x1: bx + bw, y1: yy, x2: bx + bw + 12, y2: yy});
    if (pin.pin) el(g, 'text', {x: bx + bw - 5, y: yy + 4, 'text-anchor': 'end', class: 'pin'}, pin.pin);
    if (i > 0) popis(g, bx + bw + 15, yy + 4, pin.operand, 'start');
  });
  if (p.pod) popis(g, bx + bw / 2, spodek + 14, p.pod);
}
// FBD (F1): geometrie z fbd.rozloz — boxy s piny, negace kroužkem, signály ortogonálně, uzly odboček
function kresliFBD(net, rozdil) {
  const k = net.kresba;
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', k.sirka); svg.setAttribute('height', k.vyska);
  svg.setAttribute('viewBox', `0 0 ${k.sirka} ${k.vyska}`);
  const vod = el(svg, 'g', {});
  for (const [x1, y1, x2, y2] of k.cary) el(vod, 'line', {class: 'vod', x1, y1, x2, y2});
  for (const [cx, cy] of k.uzly) el(vod, 'circle', {class: 'uzel', cx, cy, r: 3});
  const gp = el(svg, 'g', {});
  const zp = net.rozdil_piny || {};
  for (const d of k.boxy) {
    const g = el(gp, 'g', {'data-id': d.id, class: rozdil[d.id] ? 'd-' + rozdil[d.id] : ''});
    const z = zp[d.id], ticho = (e, zmena) => { if (z && !zmena && e) e.classList.add('beze-zmeny'); };
    el(g, 'rect', {class: 'box', x: d.x, y: d.y, width: d.w, height: d.h, rx: 2});
    el(g, 'text', {x: d.x + d.w / 2, y: d.y_titul, 'text-anchor': 'middle', class: 'titul'}, d.titul);
    if (d.sablona) el(g, 'text', {x: d.x + d.w / 2, y: d.y_sablona, 'text-anchor': 'middle', class: 'pin'}, d.sablona);
    if (d.nad != null) ticho(popis(g, d.x + d.w / 2, d.y_nad, d.nad), z && z.nad);
    for (const v of d.vstupy) {
      const xb = d.x - (v.neg ? 8 : 0);
      if (v.operand !== null) {
        el(g, 'line', {class: 'vod', x1: xb - 14, y1: v.y, x2: xb, y2: v.y});
        ticho(popis(g, xb - 17, v.y + 4, v.operand, 'end'), z && z.vstupy.includes(v.n));
      }
      if (v.neg) el(g, 'circle', {class: 'prv neg', cx: d.x - 4, cy: v.y, r: 4});
      if (v.pin) ticho(el(g, 'text', {x: d.x + 4, y: v.y + 4, class: 'pin'}, v.pin), z && z.vstupy.includes(v.n));
      el(g, 'rect', {class: 'hit-pin', x: d.x - 70, y: v.y - 7, width: 74, height: 14, 'data-n': v.n});
    }
    for (const v of d.vystupy) {
      const xa = d.x + d.w + (v.neg ? 8 : 0);
      if (v.pahyl) el(g, 'line', {class: 'vod', x1: xa, y1: v.y, x2: xa + 12, y2: v.y});
      if (v.neg) el(g, 'circle', {class: 'prv neg', cx: d.x + d.w + 4, cy: v.y, r: 4});
      const zm = z && z.vystupy.includes(v.pin);
      if (v.operand !== null) ticho(popis(g, xa + 15, v.y + 4, v.operand, 'start'), zm);
      if (v.pin) ticho(el(g, 'text', {x: d.x + d.w - 4, y: v.y + 4, 'text-anchor': 'end', class: 'pin'}, v.pin), zm);
    }
  }

  return svg;
}
function kresli(net, rozdil) {
  const k = net.kresba;
  rozdil = rozdil || {};
  if (k.fbd) return kresliFBD(net, rozdil);
  const prvky = Object.fromEntries(net.prvky.map(p => [p.id, p]));
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', k.sirka); svg.setAttribute('height', k.vyska);
  svg.setAttribute('viewBox', `0 0 ${k.sirka} ${k.vyska}`);
  const vod = el(svg, 'g', {});
  for (const [x1, y1, x2, y2] of k.cary) el(vod, 'line', {class: 'vod', x1, y1, x2, y2});
  const gp = el(svg, 'g', {});
  for (const d of k.prvky) {
    const p = prvky[d.id];
    const g = el(gp, 'g', {'data-id': d.id, class: rozdil[d.id] ? 'd-' + rozdil[d.id] : ''});
    if (p.typ.startsWith('kontakt')) kontakt(g, d, p);
    else if (p.typ.startsWith('civka') || p.typ === 'ret') civka(g, d, p);
    else if (p.typ === 'porovnani') porovnani(g, d, p);
    else if (p.typ === 'not') negace(g, d);
    else box(g, d, p);
  }
  el(svg, 'line', {class: 'lista', x1: k.lista.x, y1: k.lista.y1, x2: k.lista.x, y2: k.lista.y2});
  if (k.prazdny) el(svg, 'text', {x: k.lista.x + 14, y: k.vyska / 2 + 4, class: 'prazdny'}, '(prázdný network)');
  return svg;
}
function popisPrvku(p) {
  if (!p) return '?';
  if (p.typ === 'box') return `[${p.instance ? p.instance + ' ' : ''}${p.nazev}(${p.vstupy.map(x => x.pin + ':=' + x.operand).concat(p.vystupy.map(x => x.pin + '=>' + x.operand)).join(', ')})]`;
  if (p.typ === 'porovnani') return `|${p.in1} ${p.op} ${p.in2}|`;
  const zn = {kontakt: '| |', kontakt_nc: '|/|', kontakt_p: '|P|', kontakt_n: '|N|', civka: '( )', civka_s: '(S)',
              civka_r: '(R)', civka_neg: '(/)', ret: '(RET)', not: '|NOT|'}[p.typ] || p.typ;
  return `${zn} ${p.operand || ''}`;
}
function seznamRungu(net) {
  const prvky = Object.fromEntries(net.prvky.map(p => [p.id, p]));
  const div = document.createElement('div');
  div.className = 'rungy';
  for (const r of net.rungy) {
    const casti = [r.z].concat(r.cesta.map(c => c.startsWith('wire#') ? '● ' + c.slice(5) : popisPrvku(prvky[c])));
    if (r.do) casti.push('→ ' + r.do);
    const d = document.createElement('div');
    d.textContent = casti.join('  —  ');
    div.appendChild(d);
  }
  return div;
}

const enc = encodeURIComponent;

// strom úprav: projekt → kolo → blok → NW → úprava
function stromHtml(st, aktId) {
  let h = '<h2>Úpravy</h2><div class="strom">';
  if (!st.projekty.length) h += '<p class="prazdno">Zatím žádné úpravy.</p>';
  const skup = (pole, klic) => {
    const m = new Map();
    for (const x of pole) { const k = klic(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }
    return m;
  };
  for (const p of st.projekty) {
    h += `<div class="u0">${esc(p.projekt)}</div>`;
    for (const [, uk] of skup(p.upravy, u => String(u.kolo ?? '').trim().toLowerCase())) {
      h += `<div class="u1">Kolo: ${esc(String(uk[0].kolo ?? '').trim())}</div>`;
      for (const [blok, ub] of skup(uk, u => u.blok)) {
        const u0 = ub[0];
        h += `<div class="u2">${esc(u0.druh || '')}${u0.cislo_bloku ?? ''} "${esc(blok)}"</div>`;
        const nws = [...skup(ub, u => u.nw)].sort((a, b) => a[0] - b[0]);
        for (const [nw, un] of nws) {
          h += `<a class="u3" href="?projekt=${enc(p.projekt)}&blok=${enc(blok)}&nw=${nw}"><span class="c">NW ${nw}</span>${esc(un[0].titulek || '')}</a>`;
          for (const u of un) {
            h += `<a class="u4 ${u.id === aktId ? 'akt' : ''}" href="?uprava=${enc(u.id)}"><span class="c">${esc(u.id)}</span>` +
                 `<span class="stav s-${esc(u.stav)}">${esc(u.stav)}</span>${esc(u.poznamka || '')}</a>`;
          }
        }
      }
    }
  }
  return h + '</div>';
}
let posledniStav = {projekty: []};
async function stromNacti(aktId) {
  try { posledniStav = await api('/api/stav'); return stromHtml(posledniStav, aktId); }
  catch (e) { return `<h2>Úpravy</h2><p class="varovani">⚠ ${esc(e.message)}</p>`; }
}
function networkyHtml(b, nw, url) {
  return `<h2>${esc(b.blok)} — networky</h2>` + b.networky.map(n =>
    `<a class="${n.nw === nw ? 'akt' : ''}" href="${url(n.nw)}"><span class="c">NW ${n.nw}</span>${esc(n.titulek || '')}` +
    `${n.jazyk !== 'LAD' ? `<span class="j">${esc(n.jazyk || '?')}</span>` : ''}</a>`).join('');
}
function platno(m, net, rozdil) {
  if (net.kresba) {
    const pl = document.createElement('div');
    pl.className = 'platno';
    pl.appendChild(kresli(net, rozdil));
    m.appendChild(pl);
  } else if (net.rungy && net.rungy.length) {
    m.appendChild(seznamRungu(net));
  } else if (net.text) {
    const pre = document.createElement('pre');
    pre.textContent = net.text;
    m.appendChild(pre);
  }
}

                                 po: fbd ? {jazyk: 'FBD', prvky: net.prvky} : {prvky: net.prvky, rungy: net.rungy}, poznamka: ''});
        location.href = `?uprava=${enc(u.id)}&upravit=1`;

    platno(m, {kresba: net.jako_lad.kresba, prvky: net.jako_lad.prvky, rungy: net.jako_lad.rungy});

  // scénáře pro snímky / Clauda (headless nemá myš): &ops=<JSON operací>, &vyber=<id>, &paleta=<klíč>, &vetev=r,k
  if (q.get('ops')) await prepocti(JSON.parse(q.get('ops')));
  if (q.get('vyber')) { ed.vyber = q.get('vyber'); ed.vstup = q.get('vstup') ? +q.get('vstup') : null; vykresli(); }
  if (q.get('paleta')) vyberPalety(q.get('paleta'));
  if (q.get('vetev')) { const [r, k] = q.get('vetev').split(',').map(Number); ed.vetev = {od: {r, k}}; vykresli(); }
}

async function prepocti(ops, bezHistorie) {
  const res = await apiJson('POST', '/api/rozlozeni', {projekt: ed.u.projekt, pred: ed.pred, po: ed.po, ops, f: ed.f, sirka: sirkaPlatna()});
  if (ops.length && !bezHistorie) { ed.hist.push(ed.po); ed.redo = []; ed.zmeneno = true; }
  if (ops.length) rezim('');
  ed.po = res.po;
  ed.res = res;
  if (ed.vyber && !res.po.prvky.some(p => p.id === ed.vyber)) ed.vyber = null;
  vykresli();
  return res;
}
async function provedOp(op) {
  try { return await prepocti([op]); }
  catch (e) { rezim('⚠ ' + e.message); }
}
async function zpet() {
  if (!ed.hist.length) return;
  ed.redo.push(ed.po); ed.po = ed.hist.pop(); ed.zmeneno = true;
  await prepocti([]);
}
async function znovu() {
  if (!ed.redo.length) return;
  ed.hist.push(ed.po); ed.po = ed.redo.pop(); ed.zmeneno = true;
  await prepocti([]);
}
async function smazVyber() {
  const id = ed.vyber;
  ed.vyber = null;
  await provedOp({typ: 'smaz', id});
}
async function uloz() {
  try {
    const r = await apiJson('POST', `/api/uprava/${enc(ed.u.id)}/po`, {po: ed.po});
    ed.zmeneno = false;
    rezim(`Uloženo ${new Date().toLocaleTimeString('cs-CZ')}` + (r.chyby.length ? ` — ${nChyb(r.chyby.length, JAZ())} (hlavička úpravy je označí)` : ' — bez chyb'), true);
  } catch (e) { rezim('⚠ Uložení selhalo: ' + e.message); }
}
function rezim(text, zprava) {
  const r = $('ed-rezim');
  if (!r) return;
  r.textContent = text || '';
  r.classList.toggle('zprava', !!zprava);
}
function klavesy(e) {
  const vPoli = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName);
  if (e.key === 'Escape') {
    if (vPoli) { document.activeElement.blur(); return; }
    if (ed.vklad || ed.vetev) { ed.vklad = null; ed.vetev = null; paletaAkt(); vykresli(); }
    else if (ed.vyber) { ed.vyber = null; vykresli(); }
    return;
  }
  if (vPoli) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? znovu() : zpet(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); znovu(); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && ed.vyber) { e.preventDefault(); smazVyber(); }
}

// paleta: instrukce + bloky projektu, hledání podle názvu
function paleta() {
  const p = $('paleta');
  p.hidden = false;
  p.innerHTML = `<h2>Paleta</h2><input id="pal-hledat" placeholder="hledat (TON, FB_…, MOVE)" autocomplete="off"><div id="pal-seznam"></div>`;
  $('pal-hledat').oninput = paletaSeznam;
  paletaSeznam();
}
function paletaSeznam() {
  const h = ($('pal-hledat').value || '').trim().toLowerCase();
  const sk = new Map();
  const zdroj = ed.fbd ? ed.kat.fbd.concat(ed.kat.instrukce.filter(x => x.prvek.typ === 'box' && !/_TRIG$/.test(x.klic)))
                       : ed.kat.instrukce;
  for (const x of zdroj) { if (!sk.has(x.skupina)) sk.set(x.skupina, []); sk.get(x.skupina).push(x); }
  sk.set('Bloky projektu', ed.kat.bloky.map(b => ({klic: b.klic, nazev: b.nazev, popis: `${b.f ? 'F-' : ''}${b.druh}${b.cislo ?? ''}` +
          (b.instance.length ? ' · ' + b.instance.join(', ') : '')})));
  let html = '';
  for (const [skup, pol] of sk) {
    const f = pol.filter(x => !h || (x.klic + ' ' + x.nazev + ' ' + (x.popis || '')).toLowerCase().includes(h));
    if (!f.length) continue;
    html += `<h2>${esc(skup)}</h2>` + f.map(x => `<div class="pol" draggable="true" data-klic="${esc(x.klic)}" title="${esc(x.popis || '')}">` +
      `<b>${esc(x.nazev)}</b><span>${esc(x.popis || '')}</span></div>`).join('');
  }
  $('pal-seznam').innerHTML = html || '<p class="prazdno">Nic nenalezeno.</p>';
  for (const el of $('pal-seznam').querySelectorAll('.pol')) {
    el.onclick = () => vyberPalety(ed.vklad && ed.vklad.klic === el.dataset.klic ? null : el.dataset.klic);
    el.ondragstart = e => { e.dataTransfer.setData('text/plain', el.dataset.klic); vyberPalety(el.dataset.klic); };
  }
  paletaAkt();
}
function paletaAkt() {
  for (const el of document.querySelectorAll('#paleta .pol')) {
    const akt = !!ed.vklad && el.dataset.klic === ed.vklad.klic;
    el.classList.toggle('akt', akt);
    if (akt) el.scrollIntoView({block: 'nearest'});
  }
}
function sablona(klic) {
  const x = (ed.fbd ? ed.kat.fbd.find(i => i.klic === klic) : null) || ed.kat.instrukce.find(i => i.klic === klic) ||
            ed.kat.bloky.find(b => b.klic === klic);
  const pr = x ? JSON.parse(JSON.stringify(x.prvek)) : null;
  if (pr && ed.fbd && !pr.nazev) pr.nazev = x.nazev;          // jen pro text režimu; FBD vkládá podle klíče
  return pr;
}
function vyberPalety(klic) {
  const prvek = klic ? sablona(klic) : null;
  ed.vklad = prvek ? {klic, prvek, druh: DRUH(prvek)} : null;
  paletaAkt();
  vykresli();
}
// našeptávání operandů: tagy, členy globálních DB, proměnné upravovaného bloku (#…), instanční DB
function operandy() {
  const o = [];
  for (const t of ed.kat.tagy) o.push([`"${t.jmeno}"`, `${t.typ} ${t.adresa}`]);
  for (const d of ed.kat.db) {
    if (d.instance_typ) o.push([`"${d.nazev}"`, `instance ${d.instance_typ}`]);
    for (const c of d.cleny) o.push([`"${d.nazev}".${c.jmeno}`, c.typ]);
  }
  const blok = ed.kat.bloky.find(b => b.nazev === ed.u.blok);
  if (blok) for (const [sek, pole] of Object.entries(blok.rozhrani)) for (const v of pole) o.push([`#${v.jmeno}`, `${v.typ} (${sek})`]);
  $('operandy').innerHTML = o.map(([v, l]) => `<option value="${esc(v)}" label="${esc(l)}"></option>`).join('');
}

// místa vložení: platná pro vybraný prvek palety, ve větvi všechna (začátek) / za začátkem v témže rungu (konec)
function mistaViditelna() {
  const m = ed.res.mista || [];
  if (ed.vetev) return ed.vetev.od ? m.filter(x => x.r === ed.vetev.od.r && x.k > ed.vetev.od.k) : m;
  if (ed.vklad) return m.filter(x => x[ed.vklad.druh]);
  return [];
}
function nejblizsi(e) {
  const svg = $('ed-platno').querySelector('svg');
  if (!svg) return null;
  const b = svg.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
  let best = null, dist = 45;
  for (const m of mistaViditelna()) {
    const d = Math.hypot(m.x - x, m.y - y);
    if (d < dist) { dist = d; best = m; }
  }
  return best;
}
function zvyrazniBlizke(m) {
  const i = mistaViditelna().indexOf(m);
  for (const c of document.querySelectorAll('#ed-platno .misto')) c.classList.toggle('blizko', +c.dataset.i === i);
}
async function vlozNa(m) {
  if (ed.vetev) {
    if (!ed.vetev.od) { ed.vetev.od = {r: m.r, k: m.k}; vykresli(); return; }
    const prvek = ed.vklad ? ed.vklad.prvek : sablona('NO');
    const od = ed.vetev.od;
    ed.vetev = null; ed.vklad = null; paletaAkt();
    const res = await provedOp({typ: 'vetev', od, do: {r: m.r, k: m.k}, prvek});
    if (res && res.posledni) { ed.vyber = res.posledni; vykresli(); }
    return;
  }
  if (!ed.vklad) return;
  const prvek = ed.vklad.prvek, klic = ed.vklad.klic;
  ed.vklad = null; paletaAkt();
  const res = await provedOp(ed.fbd ? {typ: 'vloz_box', prvek: klic, do: m.do}
                                    : {typ: 'vloz', misto: {r: m.r, k: m.k}, prvek});
  if (res && res.posledni) { ed.vyber = res.posledni; vykresli(); }
}

function vykresli() {
  const res = ed.res, pl = $('ed-platno');
  if (!res || !pl) return;
  pl.innerHTML = '';
  if (!res.kresba) { pl.appendChild(seznamRungu(res)); }
  else {
    const svg = kresli(res, res.rozdil);
    pl.appendChild(svg);
    const chybne = new Set(res.chyby.map(c => c.id).filter(Boolean));
    for (const g of svg.querySelectorAll('g[data-id]')) {
      const id = g.dataset.id, bb = g.getBBox();
      const ram = (tr, o) => { const r = el(g, 'rect', {class: tr, x: bb.x - o, y: bb.y - o, width: bb.width + 2 * o, height: bb.height + 2 * o, rx: 3});
                               g.insertBefore(r, g.firstChild); };
      if (id.startsWith('x:')) continue;
      ram('hit', 4);
      if (chybne.has(id)) ram('ram-chyba', 5);
      if (id === ed.vyber) ram('ram-vyber', 7);
      g.onclick = ev => {
        ev.stopPropagation(); if (ed.vklad || ed.vetev) return;
        ed.vstup = ev.target.dataset && ev.target.dataset.n ? +ev.target.dataset.n : null;
        ed.vyber = id; vykresli(); vlastnostiFokus();
      };
    }
    svg.onclick = () => { if (!ed.vklad && !ed.vetev && ed.vyber) { ed.vyber = null; vykresli(); } };
    const gm = el(svg, 'g', {});
    mistaViditelna().forEach((m, i) => {
      const c = el(gm, 'circle', {class: 'misto', cx: m.x, cy: m.y, r: 7, 'data-i': i});
      el(c, 'title', {}, m.fbd ? (m.do ? `box ${m.do.id}, ${m.novy_vstup ? 'nový ' : ''}vstup ${m.do.vstup}` : 'nová logická cesta')
                               : `rung ${m.r + 1}, pozice ${m.k}`);
      c.onclick = ev => { ev.stopPropagation(); vlozNa(m); };
    });
    if (ed.vetev && ed.vetev.od) {
      const a = (res.mista || []).find(x => x.r === ed.vetev.od.r && x.k === ed.vetev.od.k);
      if (a) el(gm, 'circle', {class: 'misto zvolene', cx: a.x, cy: a.y, r: 7});
    }
  }
  // režim, chyby, vlastnosti, tlačítka
  if (ed.fbd && ed.vklad) rezim(`Vkládání: ${ed.vklad.prvek.nazev || ed.vklad.klic} — klikni na vstup boxu (box převezme jeho signál), pod poslední vstup (nový vstup) nebo vlevo dole (nová logická cesta). Esc zruší.`);
  else if (ed.vetev) rezim(ed.vetev.od ? 'Větev: klikni na konec úseku ve stejném rungu (Esc zruší).'
                                  : `Větev${ed.vklad ? ' s ' + ed.vklad.prvek.nazev : ''}: klikni na začátek úseku (Esc zruší).`);
  else if (ed.vklad) rezim(`Vkládání: ${ed.vklad.prvek.nazev || ed.vklad.klic} — klikni na zvýrazněné místo nebo přetáhni na vodič (Esc zruší).`);
  else if (!$('ed-rezim').classList.contains('zprava')) rezim('');
  if ($('ed-vetev')) $('ed-vetev').classList.toggle('akt', !!ed.vetev);
  if (ed.fbd) {
    const p = ed.vyber && ed.po.prvky.find(x => x.id === ed.vyber);
    const log = p && ['and', 'or', 'xor'].includes(p.typ);
    $('ed-plus').disabled = !log; $('ed-minus').disabled = !log || p.vstupy.length <= 2;
    $('ed-neg').disabled = !p || !p.vstupy.length;
  }
  $('ed-zpet').disabled = !ed.hist.length;
  $('ed-znovu').disabled = !ed.redo.length;
  $('ed-smaz').disabled = !ed.vyber;
  const nch = res.chyby.filter(c => !c.varovani).length;
  $('ed-znacka').innerHTML = nch ? `<span class="znacka-chyb">⚠ ${nChyb(nch, JAZ())}</span> ·` : '';
  $('ed-chyby').innerHTML = res.chyby.length
    ? res.chyby.map(c => `<div data-id="${esc(c.id || '')}" class="${c.varovani ? 'var' : ''}">⚠ ${esc(c.chyba)}</div>`).join('')
    : '<div class="ok">✓ Bez chyb.</div>';
  for (const d of $('ed-chyby').querySelectorAll('div[data-id]'))
    if (d.dataset.id) d.onclick = () => { ed.vyber = d.dataset.id; vykresli(); };
  vlastnosti();
}

function vlastnostiFBD(v, p) {
  const T = {and: '&', or: '>=1', xor: 'x', assign: '=', s: 'S', r: 'R', sr: 'SR', rs: 'RS', ptrig: 'P_TRIG', ntrig: 'N_TRIG'};
  const P = Object.fromEntries(ed.po.prvky.map(x => [x.id, x]));
  const inp = (attrs, hodnota) => `<input ${attrs} value="${esc(hodnota ?? '')}" list="operandy" autocomplete="off">`;
  const neg = (attrs, on) => `<label title="negace (Ctrl+Shift+4 v TIA)" style="white-space:nowrap"><input type="checkbox" ${attrs} ${on ? 'checked' : ''} style="width:auto"> NOT</label>`;
  let h = `<table><colgroup><col style="width:96px"><col><col style="width:62px"></colgroup>` +
          `<tr class="sekce"><td colspan="3">${esc(p.id)} · ${esc(T[p.typ] || p.nazev || p.typ)}${p.instance ? ' ' + esc(p.instance) : ''}</td></tr>`;
  if (T[p.typ] && 'operand' in p && !['and', 'or', 'xor'].includes(p.typ))
    h += `<tr><td>${['ptrig', 'ntrig'].includes(p.typ) ? 'bit paměti' : 'operand'}</td><td colspan="2">${inp('data-op="nad"', p.operand)}</td></tr>`;
  if (p.typ === 'volani' && p.instance != null) h += `<tr><td>instance</td><td colspan="2">${inp('data-op="nad"', p.instance)}</td></tr>`;
  if (p.vstupy.length) h += `<tr class="sekce"><td colspan="3">Vstupy</td></tr>`;
  for (const x of p.vstupy) {
    const zdroj = x.signal ? `<span style="color:var(--tlum)">← výstup ${esc(T[(P[x.signal] || {}).typ] || (P[x.signal] || {}).nazev || x.signal)} (${esc(x.signal)})</span>`
                           : inp(`data-vstup="${x.n}"`, x.operand);
    h += `<tr${ed.vstup === x.n ? ' style="background:var(--vyber)"' : ''}><td>${esc(x.pin)}${['and', 'or', 'xor'].includes(p.typ) ? '' : ''}</td><td>${zdroj}</td><td>${neg(`data-neg="${x.n}"`, x.neg)}</td></tr>`;
  }
  if (p.vystupy.length) h += `<tr class="sekce"><td colspan="3">Výstupy</td></tr>`;
  for (const x of p.vystupy) h += `<tr><td>${esc(x.pin)}</td><td>${inp(`data-vystup="${esc(x.pin)}"`, x.operand)}</td><td>${neg(`data-negv="${esc(x.pin)}"`, x.neg)}</td></tr>`;
  h += `<tr><td>výstup boxu</td><td></td><td>${neg('data-negh="1"', p.neg_vystup)}</td></tr>`;
  v.innerHTML = h + '</table>';
  for (const i of v.querySelectorAll('[data-op]')) i.onchange = () => provedOp({typ: 'zmen_operand', id: p.id, operand: i.value});
  for (const i of v.querySelectorAll('[data-vstup]')) i.onchange = () => provedOp({typ: 'zmen_operand', id: p.id, vstup: +i.dataset.vstup, operand: i.value});
  for (const i of v.querySelectorAll('[data-vystup]')) i.onchange = () => provedOp({typ: 'zmen_pin', id: p.id, pin: i.dataset.vystup, operand: i.value});
  for (const i of v.querySelectorAll('[data-neg]')) i.onchange = () => { ed.vstup = +i.dataset.neg; provedOp({typ: 'negace', id: p.id, vstup: +i.dataset.neg}); };
  for (const i of v.querySelectorAll('[data-negv]')) i.onchange = () => provedOp({typ: 'negace', id: p.id, vystup: i.dataset.negv});
  for (const i of v.querySelectorAll('[data-negh]')) i.onchange = () => provedOp({typ: 'negace', id: p.id, vystup: 'hlavni'});
}
function vlastnosti() {
  const v = $('ed-vlastnosti');
  const p = ed.vyber && ed.po.prvky.find(x => x.id === ed.vyber);
  if (!p) { v.innerHTML = `<p class="komentar">Klikni na ${ed.fbd ? 'box nebo jeho vstup' : 'prvek'} v plátně. Delete smaže, Ctrl+Z vrátí.</p>`; return; }
  if (ed.fbd) { vlastnostiFBD(v, p); return; }
  const pole = (klic, hodnota, popis, list) => `<tr><td>${esc(popis)}</td><td><input data-pole="${klic}" value="${esc(hodnota ?? '')}" list="${list || 'operandy'}" autocomplete="off"></td></tr>`;
  let h = `<table><colgroup><col style="width:96px"><col></colgroup><tr class="sekce"><td colspan="2" title="${esc(popisPrvku(p))}">${esc(p.id)} · ${esc(popisPrvku(p))}</td></tr>`;
  if (p.typ === 'box') {
    if (p.instance != null) {
      const b = ed.kat.bloky.find(x => x.nazev === p.nazev);
      h += pole('instance', p.instance, 'instance', 'operandy');
      if (b && b.instance.length) h += `<tr><td></td><td style="color:var(--tlum);font-size:12px">instance ${esc(p.nazev)}: ${b.instance.map(esc).join(', ')}</td></tr>`;
    }
    if (p.sablona != null) h += pole('sablona', p.sablona, 'typ', '');
    if (p.pod != null) h += pole('pod', p.pod, 'bit hrany');
    if (p.vstupy.length) h += `<tr class="sekce"><td colspan="2">Vstupy</td></tr>`;
    p.vstupy.forEach((x, i) => {
      h += x.operand.startsWith('wire#') ? `<tr><td>${esc(x.pin)}</td><td style="color:var(--tlum)">← napájeno větví ${esc(x.operand.slice(5))}</td></tr>`
                                         : `<tr><td>${esc(x.pin)}</td><td><input data-pin="vstupy:${i}" value="${esc(x.operand)}" list="operandy" autocomplete="off"></td></tr>`;
    });
    if (p.vystupy.length) h += `<tr class="sekce"><td colspan="2">Výstupy</td></tr>`;
    p.vystupy.forEach((x, i) => { h += `<tr><td>${esc(x.pin)}</td><td><input data-pin="vystupy:${i}" value="${esc(x.operand)}" list="operandy" autocomplete="off"></td></tr>`; });
  } else if (p.typ === 'porovnani') {
    h += pole('in1', p.in1, 'IN1');
    h += `<tr><td>op</td><td><select data-pole="op">${['==', '<>', '>', '>=', '<', '<='].map(o => `<option ${o === p.op ? 'selected' : ''}>${o}</option>`).join('')}</select></td></tr>`;
    h += pole('in2', p.in2, 'IN2') + pole('sablona', p.sablona, 'typ', '');
  } else if (p.typ !== 'not') {
    h += pole('operand', p.operand, 'operand');
    if (p.typ === 'kontakt_p' || p.typ === 'kontakt_n') h += pole('bit', p.bit, 'bit hrany');
  }
  v.innerHTML = h + '</table>';
  for (const i of v.querySelectorAll('[data-pole]')) i.onchange = () => provedOp({typ: 'zmen', id: p.id, hodnoty: {[i.dataset.pole]: i.value}});
  for (const i of v.querySelectorAll('[data-pin]')) i.onchange = () => {
    const [str, idx] = i.dataset.pin.split(':');
    const piny = p[str].map(x => ({pin: x.pin, operand: x.operand}));
    piny[+idx].operand = i.value.trim();
    provedOp({typ: 'zmen', id: p.id, hodnoty: {[str]: piny}});
  };
}
function vlastnostiFokus() {
  const i = (ed.vstup && $('ed-vlastnosti').querySelector(`input[data-vstup="${ed.vstup}"]`)) || $('ed-vlastnosti').querySelector('input');
  if (i) { i.focus(); i.select(); }
}

async function start() {
  if (q.get('snimek') === '1') document.body.classList.add('snimek');
  const projekt = q.get('projekt'), blok = q.get('blok');
  if (q.get('uprava') && q.get('upravit') === '1') await editor(q.get('uprava'));
  else if (q.get('uprava')) await zobrazUpravu(q.get('uprava'));
  else if (projekt && blok) await zobrazNetwork(projekt, blok);
  else { $('nw').innerHTML = await stromNacti(null); await vyberExportu(); }
  document.body.dataset.hotovo = '1';
}
start().catch(e => {
  $('obsah').innerHTML = `<div class="varovani">⚠ ${esc(e.message)}</div>`;
  document.body.dataset.hotovo = '1';
});
</script>
