<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIAC_Editor</title>
<style>
:root {
  --bg: #1e1e1e; --panel: #252526; --edge: #3a3a3a; --text: #f0f0f0; --muted: #a8a8a8;
  --accent: #00D7FF; --wire: #8A8A8A; --warnings: #fb923c; --select: #0e3a47;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #ffffff; --panel: #f3f3f3; --edge: #d0d0d0; --text: #111111; --muted: #555555;
    --accent: #0a7ea4; --wire: #4a4a4a; --warnings: #c2410c; --select: #d6f1fa;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #ffffff; --panel: #f3f3f3; --edge: #d0d0d0; --text: #111111; --muted: #555555;
  --accent: #0a7ea4; --wire: #4a4a4a; --warnings: #c2410c; --select: #d6f1fa;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, sans-serif;
       display: grid; grid-template-rows: auto 1fr; }
header { display: flex; gap: 16px; align-items: baseline; padding: 8px 16px; border-bottom: 1px solid var(--edge);
         background: var(--panel); }
header b { color: var(--accent); font-size: 15px; }
header .info { color: var(--muted); }
.main { display: grid; grid-template-columns: 280px 1fr; min-height: 0; }
aside { border-right: 1px solid var(--edge); overflow: auto; background: var(--panel); }
aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 12px 6px; }
aside a { display: block; padding: 5px 12px; color: var(--text); text-decoration: none; border-left: 3px solid transparent;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
aside a:hover { background: var(--select); }
aside a.active { border-left-color: var(--accent); background: var(--select); }
aside a .c { color: var(--accent); font-family: Consolas, monospace; margin-right: 6px; }
aside a .j { color: var(--muted); font-size: 11px; margin-left: 4px; }
main { overflow: auto; padding: 14px 18px; min-width: 0; }
h1 { font-size: 16px; margin: 0 0 4px; font-weight: 600; }
h1 .c { color: var(--accent); font-family: Consolas, monospace; }
.comment { color: var(--muted); margin: 0 0 8px; white-space: pre-wrap; }
.warnings { color: var(--warnings); border: 1px solid var(--warnings); padding: 6px 10px; border-radius: 4px; margin: 8px 0; }
.canvas { overflow: auto; border: 1px solid var(--edge); border-radius: 4px; background: var(--bg); padding: 6px 0; }
svg text { font: 12px Consolas, "DejaVu Sans Mono", monospace; fill: var(--text); }
svg .pin { font-size: 11px; fill: var(--muted); }
svg .symbol { font-weight: bold; fill: var(--accent); }
svg .empty { fill: var(--muted); }
svg .wire { stroke: var(--wire); stroke-width: 1.5; fill: none; }
svg .rail { stroke: var(--accent); stroke-width: 4; }
svg .el { stroke: var(--accent); stroke-width: 2; fill: none; }
svg .box { stroke: var(--accent); stroke-width: 1.5; fill: var(--bg); }
svg .mask { fill: var(--bg); stroke: none; }
svg .neg { fill: var(--bg); stroke-width: 1.5; }
svg .node { fill: var(--wire); stroke: none; }
svg .hit-pin { fill: transparent; cursor: pointer; }
.procedure ol { margin: 4px 0 8px; padding-left: 22px; font-size: 13px; }
.procedure li { margin: 3px 0; }
.procedure code { font: 12px Consolas, monospace; color: var(--accent); }
.procedure h3 { display: flex; gap: 10px; align-items: center; }
.procedure button { font: inherit; font-size: 12px; padding: 1px 9px; border-radius: 4px; border: 1px solid var(--edge);
                 background: var(--panel); color: var(--text); cursor: pointer; text-transform: none; letter-spacing: 0; }
.errors .var { color: var(--muted); }
svg g.d-changed text.without-changes { fill: var(--text); font-weight: normal; }   /* FBD: u změněného boxu jen změněné piny */
pre, .rungs { font: 12px/1.6 Consolas, monospace; white-space: pre-wrap; }
.rungs div { border-bottom: 1px dashed var(--edge); padding: 2px 0; }
ul.select { list-style: none; padding: 0; columns: 3 220px; }
ul.select a { color: var(--text); }
/* M2: rozdíl a stavy */
:root { --added: #4ade80; --changed: #fb923c; --deleted: #f87171;
        --s-Proposal: #a8a8a8; --s-Approved: #00D7FF; --s-Signed: #c084fc; --s-Checked: #2dd4bf; --s-Uploaded: #facc15; --s-Tested: #4ade80; }
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --added: #15803d; --changed: #c2410c; --deleted: #b91c1c;
    --s-Proposal: #6b7280; --s-Approved: #0a7ea4; --s-Signed: #7e22ce; --s-Checked: #0f766e; --s-Uploaded: #a16207; --s-Tested: #15803d; }
}
:root[data-theme="light"] { --added: #15803d; --changed: #c2410c; --deleted: #b91c1c;
  --s-Proposal: #6b7280; --s-Approved: #0a7ea4; --s-Signed: #7e22ce; --s-Checked: #0f766e; --s-Uploaded: #a16207; --s-Tested: #15803d; }
svg g.d-added .el, svg g.d-added .box { stroke: var(--added); stroke-width: 2.5; }
svg g.d-added text, svg g.d-added .symbol { fill: var(--added); font-weight: bold; }
svg g.d-changed .el, svg g.d-changed .box { stroke: var(--changed); stroke-width: 2.5; }
svg g.d-changed text, svg g.d-changed .symbol { fill: var(--changed); font-weight: bold; }
svg g.d-deleted .el, svg g.d-deleted .box { stroke: var(--deleted); stroke-width: 2.5; stroke-dasharray: 3 2; }
svg g.d-deleted text, svg g.d-deleted .symbol { fill: var(--deleted); text-decoration: line-through; }
.tree { padding-bottom: 6px; border-bottom: 1px solid var(--edge); }
.tree .u0, .tree .u1, .tree .u2 { padding: 3px 12px; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tree .u0 { color: var(--text); font-weight: 600; }
.tree .u1 { padding-left: 22px; }
.tree .u2 { padding-left: 32px; }
.tree a.u3 { padding-left: 42px; font-size: 13px; }
.tree a.u4 { padding-left: 54px; font-size: 13px; }
.tree .empty { padding: 3px 12px; color: var(--muted); font-size: 12px; margin: 0; }
.state { display: inline-block; padding: 0 7px; border-radius: 9px; font-size: 11px; font-weight: 600; margin: 0 6px;
        border: 1px solid var(--sc); color: var(--sc); }
.s-Proposal { --sc: var(--s-Proposal); } .s-Approved { --sc: var(--s-Approved); } .s-Signed { --sc: var(--s-Signed); }
.s-Checked { --sc: var(--s-Checked); } .s-Uploaded { --sc: var(--s-Uploaded); } .s-Tested { --sc: var(--s-Tested); }
.header { color: var(--muted); margin: 2px 0 8px; }
.header b { color: var(--text); font-weight: 600; }
.buttons { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
.buttons button { font: inherit; padding: 5px 14px; border-radius: 4px; border: 1px solid var(--accent); background: transparent;
                   color: var(--accent); cursor: pointer; }
.buttons button.forward { background: var(--accent); color: var(--bg); font-weight: 600; }
.buttons button:disabled { border-color: var(--edge); background: transparent; color: var(--muted); cursor: not-allowed; }
.checks { font-size: 13px; margin: 6px 0 10px; }
.checks h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 4px; }
.checks .ok { color: var(--added); } .checks .bad { color: var(--deleted); }
/* M5: Upload / Check, zápisy, nastavení TIA */
.buttons button.tia { border-color: var(--s-Signed); color: var(--s-Signed); font-weight: 600; }
.buttons button.tia.check { border-color: var(--s-Checked); color: var(--s-Checked); }
.buttons .fblock { font-size: 12px; color: var(--warnings); align-self: center; }
.progress { font-size: 12px; color: var(--muted); align-self: center; }
.writes ol { margin: 2px 0 6px 18px; padding: 0; color: var(--muted); font-size: 12px; }
.writes ol li.bad { color: var(--deleted); }
details.tia-settings { font-size: 12px; color: var(--muted); margin: 4px 0 8px; }
details.tia-settings input { font: 12px Consolas, monospace; width: 150px; margin: 2px 6px 2px 2px; background: transparent;
                         color: var(--text); border: 1px solid var(--edge); border-radius: 3px; padding: 2px 4px; }
.legend { font-size: 12px; color: var(--muted); margin: 4px 0; display: flex; gap: 14px; }
.legend span::before { content: '■ '; } .legend .p { color: var(--added); } .legend .z { color: var(--changed); }
.legend .s { color: var(--deleted); }
.states-leg { font-size: 11px; color: var(--muted); margin: 4px 0; } .states-leg .state { margin: 0 3px; opacity: .55; }
.states-leg .state.active { opacity: 1; background: color-mix(in srgb, var(--sc) 18%, transparent); }
/* M3: editor */
.main.edit { grid-template-columns: 280px 1fr 250px; }
#palette { border-left: 1px solid var(--edge); border-right: 0; }
#palette input { width: calc(100% - 24px); margin: 4px 12px 6px; font: inherit; padding: 4px 8px; background: var(--bg);
                color: var(--text); border: 1px solid var(--edge); border-radius: 4px; }
#palette .item { display: flex; gap: 8px; align-items: baseline; padding: 4px 12px; cursor: grab; border-left: 3px solid transparent;
               white-space: nowrap; overflow: hidden; }
#palette .item:hover { background: var(--select); }
#palette .item.active { border-left-color: var(--accent); background: var(--select); }
#palette .item b { font: 600 12px Consolas, monospace; color: var(--accent); min-width: 64px; }
#palette .item span { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
.tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
.tools button { font: inherit; font-size: 13px; padding: 4px 11px; border-radius: 4px; border: 1px solid var(--edge);
                   background: var(--panel); color: var(--text); cursor: pointer; }
.tools button:hover:not(:disabled) { border-color: var(--accent); }
.tools button.active { border-color: var(--accent); color: var(--accent); }
.tools button.hl { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
.tools button:disabled { color: var(--muted); cursor: not-allowed; }
.tools input { font: inherit; font-size: 13px; padding: 3px 8px; width: 110px; background: var(--bg); color: var(--text);
                  border: 1px solid var(--edge); border-radius: 4px; }
.mode { color: var(--accent); font-size: 13px; min-height: 19px; }
.mode.message { color: var(--added); }
svg .place { fill: var(--accent); fill-opacity: .25; stroke: var(--accent); stroke-width: 2; cursor: pointer; }
svg .place:hover, svg .place.near { fill-opacity: .9; }
svg .place.chosen { fill: var(--changed); stroke: var(--changed); fill-opacity: .9; }
svg .hit { fill: transparent; cursor: pointer; }
svg .frame-select { fill: var(--accent); fill-opacity: .10; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 3; }
svg .frame-error { fill: none; stroke: var(--warnings); stroke-width: 2; }
.editor-bottom { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(300px, 1.2fr); gap: 16px; margin-top: 10px; }
.editor-bottom h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; }
.errors div { color: var(--warnings); padding: 3px 0; cursor: pointer; font-size: 13px; }
.errors .ok { color: var(--added); cursor: default; }
.editor-bottom > div { min-width: 0; }
.properties table { border-collapse: collapse; width: 100%; font-size: 13px; table-layout: fixed; }
.properties td { padding: 2px 6px 2px 0; }
.properties td:first-child { color: var(--muted); font-family: Consolas, monospace; white-space: nowrap; width: 96px; overflow: hidden; text-overflow: ellipsis; }
.properties input, .properties select { width: 100%; font: 13px Consolas, monospace; padding: 3px 6px; background: var(--bg);
                    color: var(--text); border: 1px solid var(--edge); border-radius: 3px; }
.properties input:focus { border-color: var(--accent); outline: none; }
.properties .section td { color: var(--accent); font-family: inherit; padding-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: auto; }
.mark-errors { color: var(--warnings); font-weight: 600; margin-left: 8px; }
</style>
</head>
<body>
<header><b>TIAC_Editor</b><span class="info" id="info">prohlížeč a úpravy</span></header>
<div class="main">
  <aside id="nw"></aside>
  <main id="content"></main>
  <aside id="palette" hidden></aside>
</div>
<datalist id="operands"></datalist>
<script>
'use strict';
const q = new URLSearchParams(location.search);
if (q.get('theme') === 'light') document.documentElement.dataset.theme = 'light';
if (q.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const L = 18, MAX_CHARS = 30;

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }
async function api(path) {
  const r = await fetch(path);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
function link(par) {
  const u = new URLSearchParams(q);
  for (const [k, v] of Object.entries(par)) v == null ? u.delete(k) : u.set(k, v);
  return '?' + u.toString();
}

// ---------- SVG ----------
function el(parent, nm, attrs, text) {
  const e = document.createElementNS(NS, nm);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  parent.appendChild(e);
  return e;
}
function description(g, x, y, s, anchor, cls) {
  const empty = !s;
  let t = empty ? '...' : s;
  const short = t.length > MAX_CHARS ? t.slice(0, MAX_CHARS - 1) + '…' : t;
  const e = el(g, 'text', {x, y, 'text-anchor': anchor || 'middle', class: (cls || '') + (empty ? ' empty' : '')}, short);
  if (short !== t) el(e, 'title', {}, t);
  return e;
}
function contact(g, d, p) {
  const {cx, y} = d;
  el(g, 'rect', {class: 'mask', x: cx - 8, y: y - 10, width: 16, height: 20});
  el(g, 'line', {class: 'el', x1: cx - 7, y1: y - 9, x2: cx - 7, y2: y + 9});
  el(g, 'line', {class: 'el', x1: cx + 7, y1: y - 9, x2: cx + 7, y2: y + 9});
  if (p.type === 'contact_nc') el(g, 'line', {class: 'el', x1: cx - 4, y1: y + 7, x2: cx + 4, y2: y - 7});
  if (p.type === 'contact_p' || p.type === 'contact_n') {
    el(g, 'text', {x: cx, y: y + 4, 'text-anchor': 'middle', class: 'symbol'}, p.type === 'contact_p' ? 'P' : 'N');
    description(g, cx, y + L + 4, p.bit);
  }
  description(g, cx, y - 13, p.operand);
}
function coil(g, d, p) {
  const {cx, y} = d;
  el(g, 'rect', {class: 'mask', x: cx - 9, y: y - 10, width: 18, height: 20});
  el(g, 'path', {class: 'el', d: `M${cx - 4} ${y - 9} A 13 13 0 0 0 ${cx - 4} ${y + 9}`});
  el(g, 'path', {class: 'el', d: `M${cx + 4} ${y - 9} A 13 13 0 0 1 ${cx + 4} ${y + 9}`});
  const sym = {coil_s: 'S', coil_r: 'R', coil_p: 'P', coil_n: 'N'}[p.type];
  if (sym) el(g, 'text', {x: cx, y: y + 4, 'text-anchor': 'middle', class: 'symbol'}, sym);
  if (p.type === 'coil_neg') el(g, 'line', {class: 'el', x1: cx - 3, y1: y + 6, x2: cx + 3, y2: y - 6});
  if (p.type === 'ret') {
    el(g, 'rect', {class: 'mask', x: cx - 16, y: y - 8, width: 32, height: 16});
    el(g, 'text', {x: cx, y: y + 4, 'text-anchor': 'middle', class: 'symbol'}, 'RET');
    if (p.operand) description(g, cx, y - 13, p.operand);
    return;
  }
  description(g, cx, y - 13, p.operand);
}
function comparison(g, d, p) {
  const {cx, y} = d;
  el(g, 'rect', {class: 'mask', x: cx - 16, y: y - 10, width: 32, height: 20});
  el(g, 'line', {class: 'el', x1: cx - 15, y1: y - 9, x2: cx - 15, y2: y + 9});
  el(g, 'line', {class: 'el', x1: cx + 15, y1: y - 9, x2: cx + 15, y2: y + 9});
  el(g, 'text', {x: cx, y: y + 4, 'text-anchor': 'middle', class: 'symbol'}, p.op);
  description(g, cx, y - 13, p.in1);
  if (p.template) el(g, 'text', {x: cx, y: y + L + 4, 'text-anchor': 'middle', class: 'pin'}, p.template);
  description(g, cx, y + L * (p.template ? 2 : 1) + 4, p.in2);
}
function negate(g, d) {
  const {cx, y} = d;
  el(g, 'rect', {class: 'mask', x: cx - 16, y: y - 10, width: 32, height: 20});
  el(g, 'line', {class: 'el', x1: cx - 15, y1: y - 9, x2: cx - 15, y2: y + 9});
  el(g, 'line', {class: 'el', x1: cx + 15, y1: y - 9, x2: cx + 15, y2: y + 9});
  el(g, 'text', {x: cx, y: y + 4, 'text-anchor': 'middle', class: 'symbol'}, 'NOT');
}
function box(g, d, p) {
  const {bx, bw, y_hl, rows, rows_r} = d;
  const top = y_hl - 13, bottom = Math.max(...rows, ...rows_r) + 11;
  el(g, 'rect', {class: 'box', x: bx, y: top, width: bw, height: bottom - top, rx: 2});
  el(g, 'text', {x: bx + bw / 2, y: y_hl + 4, 'text-anchor': 'middle', class: 'symbol'}, p.name || '');
  if (p.template) el(g, 'text', {x: bx + bw / 2, y: y_hl + L + 4, 'text-anchor': 'middle', class: 'pin'}, p.template);
  if (p.instance) description(g, bx + bw / 2, top - 6, p.instance);
  // vstupy: [napájení, ...vstupy]
  [{pin: p.power[0], operand: null}, ...p.inputs].forEach((pin, i) => {
    const yy = rows[i];
    const feed = String(pin.operand).startsWith('wire#');   // přívod: vodič vede až z buňky left
    if (i > 0) el(g, 'line', {class: 'wire', x1: feed ? d.x : bx - 12, y1: yy, x2: bx, y2: yy});
    if (pin.pin) el(g, 'text', {x: bx + 5, y: yy + 4, class: 'pin'}, pin.pin);
    if (i > 0 && !feed) description(g, bx - 15, yy + 4, pin.operand, 'end');
  });
  [{pin: p.power[1], operand: null}, ...p.outputs].forEach((pin, i) => {
    const yy = rows_r[i];
    if (i > 0) el(g, 'line', {class: 'wire', x1: bx + bw, y1: yy, x2: bx + bw + 12, y2: yy});
    if (pin.pin) el(g, 'text', {x: bx + bw - 5, y: yy + 4, 'text-anchor': 'end', class: 'pin'}, pin.pin);
    if (i > 0) description(g, bx + bw + 15, yy + 4, pin.operand, 'start');
  });
  if (p.below) description(g, bx + bw / 2, bottom + 14, p.below);
}
// FBD (F1): geometrie z fbd.rozloz — boxy s piny, negace kroužkem, signály ortogonálně, uzly odboček
function drawFBD(net, diff) {
  const k = net.drawing;
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', k.width); svg.setAttribute('height', k.height);
  svg.setAttribute('viewBox', `0 0 ${k.width} ${k.height}`);
  const wire = el(svg, 'g', {});
  for (const [x1, y1, x2, y2] of k.lines) el(wire, 'line', {class: 'wire', x1, y1, x2, y2});
  for (const [cx, cy] of k.nodes) el(wire, 'circle', {class: 'node', cx, cy, r: 3});
  const gp = el(svg, 'g', {});
  const zp = net.pin_diff || {};
  for (const d of k.boxes) {
    const g = el(gp, 'g', {'data-id': d.id, class: diff[d.id] ? 'd-' + diff[d.id] : ''});
    const z = zp[d.id], quiet = (e, change) => { if (z && !change && e) e.classList.add('without-changes'); };
    el(g, 'rect', {class: 'box', x: d.x, y: d.y, width: d.w, height: d.h, rx: 2});
    el(g, 'text', {x: d.x + d.w / 2, y: d.y_symbol, 'text-anchor': 'middle', class: 'symbol'}, d.symbol);
    if (d.template) el(g, 'text', {x: d.x + d.w / 2, y: d.y_template, 'text-anchor': 'middle', class: 'pin'}, d.template);
    if (d.above != null) quiet(description(g, d.x + d.w / 2, d.y_above, d.above), z && z.above);
    for (const v of d.inputs) {
      const xb = d.x - (v.neg ? 8 : 0);
      if (v.operand !== null) {
        el(g, 'line', {class: 'wire', x1: xb - 14, y1: v.y, x2: xb, y2: v.y});
        quiet(description(g, xb - 17, v.y + 4, v.operand, 'end'), z && z.inputs.includes(v.n));
      }
      if (v.neg) el(g, 'circle', {class: 'el neg', cx: d.x - 4, cy: v.y, r: 4});
      if (v.pin) quiet(el(g, 'text', {x: d.x + 4, y: v.y + 4, class: 'pin'}, v.pin), z && z.inputs.includes(v.n));
      el(g, 'rect', {class: 'hit-pin', x: d.x - 70, y: v.y - 7, width: 74, height: 14, 'data-n': v.n});
    }
    for (const v of d.outputs) {
      const xa = d.x + d.w + (v.neg ? 8 : 0);
      if (v.stub) el(g, 'line', {class: 'wire', x1: xa, y1: v.y, x2: xa + 12, y2: v.y});
      if (v.neg) el(g, 'circle', {class: 'el neg', cx: d.x + d.w + 4, cy: v.y, r: 4});
      const chg = z && z.outputs.includes(v.pin);
      if (v.operand !== null) quiet(description(g, xa + 15, v.y + 4, v.operand, 'start'), chg);
      if (v.pin) quiet(el(g, 'text', {x: d.x + d.w - 4, y: v.y + 4, 'text-anchor': 'end', class: 'pin'}, v.pin), chg);
    }
  }
  if (k.empty) el(svg, 'text', {x: 16, y: k.height / 2 + 4, class: 'empty'}, '(prázdný network)');
  return svg;
}
function draw(net, diff) {
  const k = net.drawing;
  diff = diff || {};
  if (k.fbd) return drawFBD(net, diff);
  const elements = Object.fromEntries(net.elements.map(p => [p.id, p]));
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', k.width); svg.setAttribute('height', k.height);
  svg.setAttribute('viewBox', `0 0 ${k.width} ${k.height}`);
  const wire = el(svg, 'g', {});
  for (const [x1, y1, x2, y2] of k.lines) el(wire, 'line', {class: 'wire', x1, y1, x2, y2});
  const gp = el(svg, 'g', {});
  for (const d of k.elements) {
    const p = elements[d.id];
    const g = el(gp, 'g', {'data-id': d.id, class: diff[d.id] ? 'd-' + diff[d.id] : ''});
    if (p.type.startsWith('contact')) contact(g, d, p);
    else if (p.type.startsWith('coil') || p.type === 'ret') coil(g, d, p);
    else if (p.type === 'comparison') comparison(g, d, p);
    else if (p.type === 'not') negate(g, d);
    else box(g, d, p);
  }
  el(svg, 'line', {class: 'rail', x1: k.rail.x, y1: k.rail.y1, x2: k.rail.x, y2: k.rail.y2});
  if (k.empty) el(svg, 'text', {x: k.rail.x + 14, y: k.height / 2 + 4, class: 'empty'}, '(prázdný network)');
  return svg;
}
function elementDescription(p) {
  if (!p) return '?';
  if (p.type === 'box') return `[${p.instance ? p.instance + ' ' : ''}${p.name}(${p.inputs.map(x => x.pin + ':=' + x.operand).concat(p.outputs.map(x => x.pin + '=>' + x.operand)).join(', ')})]`;
  if (p.type === 'comparison') return `|${p.in1} ${p.op} ${p.in2}|`;
  const sym = {contact: '| |', contact_nc: '|/|', contact_p: '|P|', contact_n: '|N|', coil: '( )', coil_s: '(S)',
              coil_r: '(R)', coil_neg: '(/)', ret: '(RET)', not: '|NOT|'}[p.type] || p.type;
  return `${sym} ${p.operand || ''}`;
}
function rungList(net) {
  const elements = Object.fromEntries(net.elements.map(p => [p.id, p]));
  const div = document.createElement('div');
  div.className = 'rungs';
  for (const r of net.rungs) {
    const parts = [r.from].concat(r.path.map(c => c.startsWith('wire#') ? '● ' + c.slice(5) : elementDescription(elements[c])));
    if (r.to) parts.push('→ ' + r.to);
    const d = document.createElement('div');
    d.textContent = parts.join('  —  ');
    div.appendChild(d);
  }
  return div;
}

const enc = encodeURIComponent;

// strom úprav: projekt → kolo → blok → NW → úprava
function treeHtml(st, activeId) {
  let h = '<h2>Úpravy</h2><div class="tree">';
  if (!st.projects.length) h += '<p class="empty">Zatím žádné úpravy.</p>';
  const group = (field, key) => {
    const m = new Map();
    for (const x of field) { const k = key(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }
    return m;
  };
  for (const p of st.projects) {
    h += `<div class="u0">${esc(p.project)}</div>`;
    for (const [, uk] of group(p.edits, u => String(u.round ?? '').trim().toLowerCase())) {
      h += `<div class="u1">Round: ${esc(String(uk[0].round ?? '').trim())}</div>`;
      for (const [block, ub] of group(uk, u => u.block)) {
        const u0 = ub[0];
        h += `<div class="u2">${esc(u0.kind || '')}${u0.block_number ?? ''} "${esc(block)}"</div>`;
        const nws = [...group(ub, u => u.nw)].sort((a, b) => a[0] - b[0]);
        for (const [nw, un] of nws) {
          h += `<a class="u3" href="?project=${enc(p.project)}&block=${enc(block)}&nw=${nw}"><span class="c">NW ${nw}</span>${esc(un[0].title || '')}</a>`;
          for (const u of un) {
            h += `<a class="u4 ${u.id === activeId ? 'active' : ''}" href="?edit=${enc(u.id)}"><span class="c">${esc(u.id)}</span>` +
                 `<span class="state s-${esc(u.state)}">${esc(u.state)}</span>${esc(u.note || '')}</a>`;
          }
        }
      }
    }
  }
  return h + '</div>';
}
let lastState = {projects: []};
async function loadTree(activeId) {
  try { lastState = await api('/api/state'); return treeHtml(lastState, activeId); }
  catch (e) { return `<h2>Úpravy</h2><p class="warnings">⚠ ${esc(e.message)}</p>`; }
}
function networksHtml(b, nw, url) {
  return `<h2>${esc(b.block)} — networks</h2>` + b.networks.map(n =>
    `<a class="${n.nw === nw ? 'active' : ''}" href="${url(n.nw)}"><span class="c">NW ${n.nw}</span>${esc(n.title || '')}` +
    `${n.language !== 'LAD' ? `<span class="j">${esc(n.language || '?')}</span>` : ''}</a>`).join('');
}
function canvas(m, net, diff) {
  if (net.drawing) {
    const pl = document.createElement('div');
    pl.className = 'canvas';
    pl.appendChild(draw(net, diff));
    m.appendChild(pl);
  } else if (net.rungs && net.rungs.length) {
    m.appendChild(rungList(net));
  } else if (net.text) {
    const pre = document.createElement('pre');
    pre.textContent = net.text;
    m.appendChild(pre);
  }
}

async function apiJson(method, path, body) {
  const r = await fetch(path, {method: method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

}

    `<div class="editor-bottom"><div><h3>Rules ${LANG()}${ed.f ? ' · F-block' : ''}</h3><div class="errors" id="ed-errors"></div></div>` +
    `<div><h3>Properties element</h3><div class="properties" id="ed-properties"></div></div></div>`;
  $('ed-undo').onclick = undo;
  $('ed-redo').onclick = redo;
  if ($('ed-branch')) $('ed-branch').onclick = () => { ed.branch = ed.branch ? null : {from: null}; render(); };
  if (fbd) {
    $('ed-plus').onclick = () => ed.select && applyOp({type: 'add_input', id: ed.select});
    $('ed-minus').onclick = () => {
      const p = ed.after.elements.find(x => x.id === ed.select);
      if (p) applyOp({type: 'remove_input', id: p.id, input: ed.input || p.inputs.length});
    };
    $('ed-neg').onclick = () => ed.select && applyOp({type: 'negate', id: ed.select, input: ed.input || 1});
  }
  $('ed-delete').onclick = () => { if (ed.select) deleteSelected(); };
  $('ed-save').onclick = save;
  $('ed-close').onclick = () => {
    if (!ed.changed || confirm('Neuložené změny se zahodí. Zavřít?')) location.href = `?edit=${enc(u.id)}`;
  };
  const pl = $('ed-canvas');
  pl.addEventListener('dragover', e => { if (ed.insert) { e.preventDefault(); highlightNear(nearest(e)); } });
  pl.addEventListener('dragleave', () => highlightNear(null));
  pl.addEventListener('drop', e => { e.preventDefault(); const m = nearest(e); if (m) insertAt(m); });
  document.addEventListener('keydown', keys);
  await recompute([]);
  // scénáře pro snímky / Clauda (headless nemá myš): &ops=<JSON operací>, &vyber=<id>, &paleta=<klíč>, &vetev=r,k
  if (q.get('ops')) await recompute(JSON.parse(q.get('ops')));
  if (q.get('select')) { ed.select = q.get('select'); ed.input = q.get('input') ? +q.get('input') : null; render(); }
  if (q.get('palette')) selectPalette(q.get('palette'));
  if (q.get('branch')) { const [r, k] = q.get('branch').split(',').map(Number); ed.branch = {from: {r, k}}; render(); }
}

async function recompute(ops, noHistory) {
  const res = await apiJson('POST', '/api/layout', {project: ed.u.project, before: ed.before, after: ed.after, ops, f: ed.f, width: canvasWidth()});
  if (ops.length && !noHistory) { ed.hist.push(ed.after); ed.redo = []; ed.changed = true; }
  if (ops.length) mode('');
  ed.after = res.after;
  ed.res = res;
  if (ed.select && !res.after.elements.some(p => p.id === ed.select)) ed.select = null;
  render();
  return res;
}
async function applyOp(op) {
  try { return await recompute([op]); }
  catch (e) { mode('⚠ ' + e.message); }
}
async function undo() {
  if (!ed.hist.length) return;
  ed.redo.push(ed.after); ed.after = ed.hist.pop(); ed.changed = true;
  await recompute([]);
}
async function redo() {
  if (!ed.redo.length) return;
  ed.hist.push(ed.after); ed.after = ed.redo.pop(); ed.changed = true;
  await recompute([]);
}
async function deleteSelected() {
  const id = ed.select;
  ed.select = null;
  await applyOp({type: 'delete', id});
}
async function save() {
  try {
    const r = await apiJson('POST', `/api/edits/${enc(ed.u.id)}/after`, {after: ed.after});
    ed.changed = false;
    mode(`Uloženo ${new Date().toLocaleTimeString('cs-CZ')}` + (r.errors.length ? ` — ${errorCount(r.errors.length, LANG())} (hlavička úpravy is označí)` : ' — without errors'), true);
  } catch (e) { mode('⚠ Uložení selhalo: ' + e.message); }
}
function mode(text, message) {
  const r = $('ed-mode');
  if (!r) return;
  r.textContent = text || '';
  r.classList.toggle('message', !!message);
}
function keys(e) {
  const inField = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName);
  if (e.key === 'Escape') {
    if (inField) { document.activeElement.blur(); return; }
    if (ed.insert || ed.branch) { ed.insert = null; ed.branch = null; markPalette(); render(); }
    else if (ed.select) { ed.select = null; render(); }
    return;
  }
  if (inField) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && ed.select) { e.preventDefault(); deleteSelected(); }
}

// paleta: instrukce + bloky projektu, hledání podle názvu
function palette() {
  const p = $('palette');
  p.hidden = false;
  p.innerHTML = `<h2>Palette</h2><input id="pal-search" placeholder="search (TON, FB_…, MOVE)" autocomplete="off"><div id="pal-list"></div>`;
  $('pal-search').oninput = paletteList;
  paletteList();
}
function paletteList() {
  const h = ($('pal-search').value || '').trim().toLowerCase();
  const sk = new Map();
  const source = ed.fbd ? ed.cat.fbd.concat(ed.cat.instruction.filter(x => x.element.type === 'box' && !/_TRIG$/.test(x.key)))
                       : ed.cat.instruction;
  for (const x of source) { if (!sk.has(x.group)) sk.set(x.group, []); sk.get(x.group).push(x); }
  sk.set('Blocks project', ed.cat.blocks.map(b => ({key: b.key, name: b.name, description: `${b.f ? 'F-' : ''}${b.kind}${b.number ?? ''}` +
          (b.instance.length ? ' · ' + b.instance.join(', ') : '')})));
  let html = '';
  for (const [group, item] of sk) {
    const f = item.filter(x => !h || (x.key + ' ' + x.name + ' ' + (x.description || '')).toLowerCase().includes(h));
    if (!f.length) continue;
    html += `<h2>${esc(group)}</h2>` + f.map(x => `<div class="item" draggable="true" data-key="${esc(x.key)}" title="${esc(x.description || '')}">` +
      `<b>${esc(x.name)}</b><span>${esc(x.description || '')}</span></div>`).join('');
  }
  $('pal-list').innerHTML = html || '<p class="empty">Nothing nenalezeno.</p>';
  for (const el of $('pal-list').querySelectorAll('.item')) {
    el.onclick = () => selectPalette(ed.insert && ed.insert.key === el.dataset.key ? null : el.dataset.key);
    el.ondragstart = e => { e.dataTransfer.setData('text/plain', el.dataset.key); selectPalette(el.dataset.key); };
  }
  markPalette();
}
function markPalette() {
  for (const el of document.querySelectorAll('#palette .item')) {
    const active = !!ed.insert && el.dataset.key === ed.insert.key;
    el.classList.toggle('active', active);
    if (active) el.scrollIntoView({block: 'nearest'});
  }
}
function template(key) {
  const x = (ed.fbd ? ed.cat.fbd.find(i => i.key === key) : null) || ed.cat.instruction.find(i => i.key === key) ||
            ed.cat.blocks.find(b => b.key === key);
  const pr = x ? JSON.parse(JSON.stringify(x.element)) : null;
  if (pr && ed.fbd && !pr.name) pr.name = x.name;          // only for text režimu; FBD vkládá by klíče
  return pr;
}
function selectPalette(key) {
  const element = key ? template(key) : null;
  ed.insert = element ? {key, element, kind: KIND(element)} : null;
  markPalette();
  render();
}
// našeptávání operandů: tagy, členy globálních DB, proměnné upravovaného bloku (#…), instanční DB
function operands() {
  const o = [];
  for (const t of ed.cat.tags) o.push([`"${t.name}"`, `${t.type} ${t.address}`]);
  for (const d of ed.cat.db) {
    if (d.instance_type) o.push([`"${d.name}"`, `instance ${d.instance_type}`]);
    for (const c of d.members) o.push([`"${d.name}".${c.name}`, c.type]);
  }
  const block = ed.cat.blocks.find(b => b.name === ed.u.block);
  if (block) for (const [sec, field] of Object.entries(block.interface)) for (const v of field) o.push([`#${v.name}`, `${v.type} (${sec})`]);
  $('operands').innerHTML = o.map(([v, l]) => `<option value="${esc(v)}" label="${esc(l)}"></option>`).join('');
}

// místa vložení: platná pro vybraný prvek palety, ve větvi všechna (začátek) / za začátkem v témže rungu (konec)
function visiblePlaces() {
  const m = ed.res.places || [];
  if (ed.branch) return ed.branch.from ? m.filter(x => x.r === ed.branch.from.r && x.k > ed.branch.from.k) : m;
  if (ed.insert) return m.filter(x => x[ed.insert.kind]);
  return [];
}
function nearest(e) {
  const svg = $('ed-canvas').querySelector('svg');
  if (!svg) return null;
  const b = svg.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
  let best = null, dist = 45;
  for (const m of visiblePlaces()) {
    const d = Math.hypot(m.x - x, m.y - y);
    if (d < dist) { dist = d; best = m; }
  }
  return best;
}
function highlightNear(m) {
  const i = visiblePlaces().indexOf(m);
  for (const c of document.querySelectorAll('#ed-canvas .place')) c.classList.toggle('near', +c.dataset.i === i);
}
async function insertAt(m) {
  if (ed.branch) {
    if (!ed.branch.from) { ed.branch.from = {r: m.r, k: m.k}; render(); return; }
    const element = ed.insert ? ed.insert.element : template('NO');
    const start = ed.branch.from;
    ed.branch = null; ed.insert = null; markPalette();
    const res = await applyOp({type: 'branch', from: start, to: {r: m.r, k: m.k}, element});
    if (res && res.last) { ed.select = res.last; render(); }
    return;
  }
  if (!ed.insert) return;
  const element = ed.insert.element, key = ed.insert.key;
  ed.insert = null; markPalette();
  const res = await applyOp(ed.fbd ? {type: 'insert_box', element: key, to: m.to}
                                    : {type: 'insert', place: {r: m.r, k: m.k}, element});
  if (res && res.last) { ed.select = res.last; render(); }
}

function render() {
  const res = ed.res, pl = $('ed-canvas');
  if (!res || !pl) return;
  pl.innerHTML = '';
  if (!res.drawing) { pl.appendChild(rungList(res)); }
  else {
    const svg = draw(res, res.diff);
    pl.appendChild(svg);
    const faulty = new Set(res.errors.map(c => c.id).filter(Boolean));
    for (const g of svg.querySelectorAll('g[data-id]')) {
      const id = g.dataset.id, bb = g.getBBox();
      const frame = (tr, o) => { const r = el(g, 'rect', {class: tr, x: bb.x - o, y: bb.y - o, width: bb.width + 2 * o, height: bb.height + 2 * o, rx: 3});
                               g.insertBefore(r, g.firstChild); };
      if (id.startsWith('x:')) continue;
      frame('hit', 4);
      if (faulty.has(id)) frame('frame-error', 5);
      if (id === ed.select) frame('frame-select', 7);
      g.onclick = ev => {
        ev.stopPropagation(); if (ed.insert || ed.branch) return;
        ed.input = ev.target.dataset && ev.target.dataset.n ? +ev.target.dataset.n : null;
        ed.select = id; render(); focusProperties();
      };
    }
    svg.onclick = () => { if (!ed.insert && !ed.branch && ed.select) { ed.select = null; render(); } };
    const gm = el(svg, 'g', {});
    visiblePlaces().forEach((m, i) => {
      const c = el(gm, 'circle', {class: 'place', cx: m.x, cy: m.y, r: 7, 'data-i': i});
      el(c, 'title', {}, m.fbd ? (m.to ? `box ${m.to.id}, ${m.new_input ? 'nový ' : ''}input ${m.to.input}` : 'nová logická path')
                               : `rung ${m.r + 1}, position ${m.k}`);
      c.onclick = ev => { ev.stopPropagation(); insertAt(m); };
    });
    if (ed.branch && ed.branch.from) {
      const a = (res.places || []).find(x => x.r === ed.branch.from.r && x.k === ed.branch.from.k);
      if (a) el(gm, 'circle', {class: 'place chosen', cx: a.x, cy: a.y, r: 7});
    }
  }
  // režim, chyby, vlastnosti, tlačítka
  if (ed.fbd && ed.insert) mode(`Vkládání: ${ed.insert.element.name || ed.insert.key} — klikni on input box (box převezme jeho signál), below poslední input (nový input) nebo left bottom (nová logická path). Esc zruší.`);
  else if (ed.branch) mode(ed.branch.from ? 'Větev: klikni on end úseku ve stejném rung (Esc zruší).'
                                  : `Větev${ed.insert ? ' s ' + ed.insert.element.name : ''}: klikni on začátek úseku (Esc zruší).`);
  else if (ed.insert) mode(`Vkládání: ${ed.insert.element.name || ed.insert.key} — klikni on zvýrazněné místo nebo přetáhni on vodič (Esc zruší).`);
  else if (!$('ed-mode').classList.contains('message')) mode('');
  if ($('ed-branch')) $('ed-branch').classList.toggle('active', !!ed.branch);
  if (ed.fbd) {
    const p = ed.select && ed.after.elements.find(x => x.id === ed.select);
    const log = p && ['and', 'or', 'xor'].includes(p.type);
    $('ed-plus').disabled = !log; $('ed-minus').disabled = !log || p.inputs.length <= 2;
    $('ed-neg').disabled = !p || !p.inputs.length;
  }
  $('ed-undo').disabled = !ed.hist.length;
  $('ed-redo').disabled = !ed.redo.length;
  $('ed-delete').disabled = !ed.select;
  const nch = res.errors.filter(c => !c.warnings).length;
  $('ed-mark').innerHTML = nch ? `<span class="mark-errors">⚠ ${errorCount(nch, LANG())}</span> ·` : '';
  $('ed-errors').innerHTML = res.errors.length
    ? res.errors.map(c => `<div data-id="${esc(c.id || '')}" class="${c.warnings ? 'var' : ''}">⚠ ${esc(c.error)}</div>`).join('')
    : '<div class="ok">✓ Without errors.</div>';
  for (const d of $('ed-errors').querySelectorAll('div[data-id]'))
    if (d.dataset.id) d.onclick = () => { ed.select = d.dataset.id; render(); };
  properties();
}

function propertiesFBD(v, p) {
  const T = {and: '&', or: '>=1', xor: 'x', assign: '=', s: 'S', r: 'R', sr: 'SR', rs: 'RS', ptrig: 'P_TRIG', ntrig: 'N_TRIG'};
  const P = Object.fromEntries(ed.after.elements.map(x => [x.id, x]));
  const inp = (attrs, value) => `<input ${attrs} value="${esc(value ?? '')}" list="operands" autocomplete="off">`;
  const neg = (attrs, on) => `<label title="negate (Ctrl+Shift+4 v TIA)" style="white-space:nowrap"><input type="checkbox" ${attrs} ${on ? 'checked' : ''} style="width:auto"> NOT</label>`;
  let h = `<table><colgroup><col style="width:96px"><col><col style="width:62px"></colgroup>` +
          `<tr class="section"><td colspan="3">${esc(p.id)} · ${esc(T[p.type] || p.name || p.type)}${p.instance ? ' ' + esc(p.instance) : ''}</td></tr>`;
  if (T[p.type] && 'operand' in p && !['and', 'or', 'xor'].includes(p.type))
    h += `<tr><td>${['ptrig', 'ntrig'].includes(p.type) ? 'bit paměti' : 'operand'}</td><td colspan="2">${inp('data-op="above"', p.operand)}</td></tr>`;
  if (p.type === 'call' && p.instance != null) h += `<tr><td>instance</td><td colspan="2">${inp('data-op="above"', p.instance)}</td></tr>`;
  if (p.inputs.length) h += `<tr class="section"><td colspan="3">Inputs</td></tr>`;
  for (const x of p.inputs) {
    const source = x.signal ? `<span style="color:var(--muted)">← výstup ${esc(T[(P[x.signal] || {}).type] || (P[x.signal] || {}).name || x.signal)} (${esc(x.signal)})</span>`
                           : inp(`data-input="${x.n}"`, x.operand);
    h += `<tr${ed.input === x.n ? ' style="background:var(--select)"' : ''}><td>${esc(x.pin)}${['and', 'or', 'xor'].includes(p.type) ? '' : ''}</td><td>${source}</td><td>${neg(`data-neg="${x.n}"`, x.neg)}</td></tr>`;
  }
  if (p.outputs.length) h += `<tr class="section"><td colspan="3">Výstupy</td></tr>`;
  for (const x of p.outputs) h += `<tr><td>${esc(x.pin)}</td><td>${inp(`data-output="${esc(x.pin)}"`, x.operand)}</td><td>${neg(`data-negv="${esc(x.pin)}"`, x.neg)}</td></tr>`;
  h += `<tr><td>výstup box</td><td></td><td>${neg('data-negh="1"', p.neg_output)}</td></tr>`;
  v.innerHTML = h + '</table>';
  for (const i of v.querySelectorAll('[data-op]')) i.onchange = () => applyOp({type: 'change_operand', id: p.id, operand: i.value});
  for (const i of v.querySelectorAll('[data-input]')) i.onchange = () => applyOp({type: 'change_operand', id: p.id, input: +i.dataset.input, operand: i.value});
  for (const i of v.querySelectorAll('[data-output]')) i.onchange = () => applyOp({type: 'change_pin', id: p.id, pin: i.dataset.output, operand: i.value});
  for (const i of v.querySelectorAll('[data-neg]')) i.onchange = () => { ed.input = +i.dataset.neg; applyOp({type: 'negate', id: p.id, input: +i.dataset.neg}); };
  for (const i of v.querySelectorAll('[data-negv]')) i.onchange = () => applyOp({type: 'negate', id: p.id, output: i.dataset.negv});
  for (const i of v.querySelectorAll('[data-negh]')) i.onchange = () => applyOp({type: 'negate', id: p.id, output: 'main'});
}
function properties() {
  const v = $('ed-properties');
  const p = ed.select && ed.after.elements.find(x => x.id === ed.select);
  if (!p) { v.innerHTML = `<p class="comment">Klikni on ${ed.fbd ? 'box nebo jeho input' : 'element'} v plátně. Delete smaže, Ctrl+Z vrátí.</p>`; return; }
  if (ed.fbd) { propertiesFBD(v, p); return; }
  const field = (key, value, description, list) => `<tr><td>${esc(description)}</td><td><input data-field="${key}" value="${esc(value ?? '')}" list="${list || 'operands'}" autocomplete="off"></td></tr>`;
  let h = `<table><colgroup><col style="width:96px"><col></colgroup><tr class="section"><td colspan="2" title="${esc(elementDescription(p))}">${esc(p.id)} · ${esc(elementDescription(p))}</td></tr>`;
  if (p.type === 'box') {
    if (p.instance != null) {
      const b = ed.cat.blocks.find(x => x.name === p.name);
      h += field('instance', p.instance, 'instance', 'operands');
      if (b && b.instance.length) h += `<tr><td></td><td style="color:var(--muted);font-size:12px">instance ${esc(p.name)}: ${b.instance.map(esc).join(', ')}</td></tr>`;
    }
    if (p.template != null) h += field('template', p.template, 'type', '');
    if (p.below != null) h += field('below', p.below, 'bit edges');
    if (p.inputs.length) h += `<tr class="section"><td colspan="2">Inputs</td></tr>`;
    p.inputs.forEach((x, i) => {
      h += x.operand.startsWith('wire#') ? `<tr><td>${esc(x.pin)}</td><td style="color:var(--muted)">← napájeno větví ${esc(x.operand.slice(5))}</td></tr>`
                                         : `<tr><td>${esc(x.pin)}</td><td><input data-pin="inputs:${i}" value="${esc(x.operand)}" list="operands" autocomplete="off"></td></tr>`;
    });
    if (p.outputs.length) h += `<tr class="section"><td colspan="2">Výstupy</td></tr>`;
    p.outputs.forEach((x, i) => { h += `<tr><td>${esc(x.pin)}</td><td><input data-pin="outputs:${i}" value="${esc(x.operand)}" list="operands" autocomplete="off"></td></tr>`; });
  } else if (p.type === 'comparison') {
    h += field('in1', p.in1, 'IN1');
    h += `<tr><td>op</td><td><select data-field="op">${['==', '<>', '>', '>=', '<', '<='].map(o => `<option ${o === p.op ? 'selected' : ''}>${o}</option>`).join('')}</select></td></tr>`;
    h += field('in2', p.in2, 'IN2') + field('template', p.template, 'type', '');
  } else if (p.type !== 'not') {
    h += field('operand', p.operand, 'operand');
    if (p.type === 'contact_p' || p.type === 'contact_n') h += field('bit', p.bit, 'bit edges');
  }
  v.innerHTML = h + '</table>';
  for (const i of v.querySelectorAll('[data-field]')) i.onchange = () => applyOp({type: 'change', id: p.id, values: {[i.dataset.field]: i.value}});
  for (const i of v.querySelectorAll('[data-pin]')) i.onchange = () => {
    const [str, idx] = i.dataset.pin.split(':');
    const pins = p[str].map(x => ({pin: x.pin, operand: x.operand}));
    pins[+idx].operand = i.value.trim();
    applyOp({type: 'change', id: p.id, values: {[str]: pins}});
  };
}
function focusProperties() {
  const i = (ed.input && $('ed-properties').querySelector(`input[data-input="${ed.input}"]`)) || $('ed-properties').querySelector('input');
  if (i) { i.focus(); i.select(); }
}

async function start() {
  if (q.get('screenshot') === '1') document.body.classList.add('screenshot');
  const project = q.get('project'), block = q.get('block');
  if (q.get('edit') && q.get('edit_mode') === '1') await editor(q.get('edit'));
  else if (q.get('edit')) await showEdit(q.get('edit'));
  else if (project && block) await showNetwork(project, block);
  else { $('nw').innerHTML = await loadTree(null); await showExports(); }
  document.body.dataset.done = '1';
}
start().catch(e => {
  $('content').innerHTML = `<div class="warnings">⚠ ${esc(e.message)}</div>`;
  document.body.dataset.done = '1';
});
</script>
