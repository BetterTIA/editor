<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BetterTIA Editor</title>
<style>
/* ---------- tokens: dark is the default, [data-theme="light"] overrides (set before paint by the script below) ---------- */
:root {
  --bg: #14171b; --panel: #1b1f24; --raised: #22272e; --edge: #2f363f; --edge-strong: #46505c;
  --text: #e7eaee; --muted: #9ba5b1; --accent: #4cc9e0; --accent-ink: #062530; --accent-soft: rgba(76, 201, 224, .14);
  --wire: #8c96a1; --operand: #e7eaee; --warning: #f0a050; --select: rgba(76, 201, 224, .14);
  --added: #6bd97e; --changed: #f0a050; --deleted: #ff7a7a;
  --s-Proposal: #a3acb7; --s-Approved: #4cc9e0; --s-Signed: #c49bff; --s-Checked: #3ad1b5; --s-Uploaded: #f2c94c; --s-Tested: #6bd97e; --s-Disapproved: #ff7a7a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 12px rgba(0, 0, 0, .25);
  --focus: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --r-sm: 5px; --r: 8px;
  --mono: Consolas, "Cascadia Mono", "DejaVu Sans Mono", monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f3f5f7; --panel: #ffffff; --raised: #f7f8fa; --edge: #d9dee4; --edge-strong: #b3bcc7;
  --text: #161b21; --muted: #56606c; --accent: #0a6f8a; --accent-ink: #ffffff; --accent-soft: rgba(10, 111, 138, .10);
  --wire: #59636e; --operand: #161b21; --warning: #b45309; --select: rgba(10, 111, 138, .10);
  --added: #15803d; --changed: #c2410c; --deleted: #b91c1c;
  --s-Proposal: #5b6573; --s-Approved: #0a6f8a; --s-Signed: #7c3aed; --s-Checked: #0f766e; --s-Uploaded: #8a5a00; --s-Tested: #15803d; --s-Disapproved: #b91c1c;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 2px 8px rgba(16, 24, 40, .06);
  color-scheme: light;
}
/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
       display: grid; grid-template-rows: auto auto 1fr; }
a { color: var(--accent); }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: var(--r-sm); }
h1 { font-size: 18px; margin: 0 0 var(--s1); font-weight: 600; line-height: 1.3; }
h1 .c, .c { color: var(--accent); font-family: var(--mono); }
code, pre { font-family: var(--mono); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
/* one button system: default = secondary, .primary/.forward/.hl = primary */
button, .btn { font-size: 13px; padding: 5px 12px; border-radius: var(--r-sm); border: 1px solid var(--edge-strong);
               background: var(--raised); color: var(--text); line-height: 1.3; transition: border-color .12s, background .12s; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { color: var(--muted); border-color: var(--edge); background: transparent; cursor: not-allowed; opacity: .75; }
button.primary, button.forward, button.hl { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
button.primary:hover:not(:disabled), button.forward:hover:not(:disabled), button.hl:hover:not(:disabled) { filter: brightness(1.08); }
button.primary:disabled, button.forward:disabled, button.hl:disabled { background: transparent; color: var(--muted); border-color: var(--edge); }
button.small { font-size: 12px; padding: 2px 8px; }
input[type=text], input:not([type]), select { background: var(--bg); border: 1px solid var(--edge-strong); border-radius: var(--r-sm);
                                             padding: 4px 8px; color: var(--text); }
input:focus-visible, select:focus-visible { border-color: var(--accent); }
/* ---------- header and status strip ---------- */
header { display: flex; gap: var(--s4); align-items: center; padding: var(--s2) var(--s4); border-bottom: 1px solid var(--edge);
         background: var(--panel); min-height: 48px; }
header .brand { display: flex; gap: var(--s2); align-items: center; color: var(--text); text-decoration: none; font-weight: 600; font-size: 15px; }
header .brand svg { flex: none; }
header a { color: var(--muted); text-decoration: none; }
header a:hover { color: var(--accent); }
header .info { color: var(--muted); font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status { margin-left: auto; display: flex; gap: var(--s1); align-items: center; flex-wrap: wrap; font-size: 12px;
          padding: 3px; border: 1px solid var(--edge); border-radius: 999px; background: var(--bg); }
.chip { display: inline-flex; gap: 6px; align-items: center; border-radius: 999px; padding: 2px 10px; color: var(--muted);
        white-space: nowrap; max-width: 300px; overflow: hidden; text-overflow: ellipsis; }
.chip::before { content: ''; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--edge-strong); }
.chip b { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.chip.ok::before { background: var(--added); box-shadow: 0 0 0 3px color-mix(in srgb, var(--added) 25%, transparent); }
.chip.warn::before { background: var(--warning); }
.chip.bad::before { background: var(--deleted); }
.chip.bad b { color: var(--deleted); }
.status button, .status select { font-size: 12px; padding: 2px 10px; border-radius: 999px; }
#theme { padding: 4px 8px; border-radius: 999px; line-height: 1; }
.demo-banner { background: repeating-linear-gradient(-45deg, var(--warning) 0 14px, color-mix(in srgb, var(--warning) 80%, #000) 14px 28px);
               color: #1b1200; font-weight: 700; text-align: center; padding: 4px var(--s4); letter-spacing: .02em; font-size: 13px; }
.demo-banner span { background: var(--warning); padding: 1px 10px; border-radius: var(--r-sm); }
.demo-banner:empty { padding: 0; }
/* ---------- layout ---------- */
.main { display: grid; grid-template-columns: 290px 1fr; min-height: 0; }
aside { border-right: 1px solid var(--edge); overflow: auto; background: var(--panel); padding-bottom: var(--s4); }
aside h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: var(--s4) var(--s3) var(--s2); }
aside a { display: block; padding: 5px var(--s3); color: var(--text); text-decoration: none;
          border-left: 3px solid transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
aside a:hover { background: var(--select); }
aside a.active { border-left-color: var(--accent); background: var(--select); font-weight: 600; }
aside a .c { margin-right: 6px; }
aside a .j { color: var(--muted); font-size: 11px; border: 1px solid var(--edge); border-radius: 4px; padding: 0 4px; }
main { overflow: auto; padding: var(--s4) var(--s5); min-width: 0; }
.comment { color: var(--muted); margin: 0 0 var(--s2); white-space: pre-wrap; }
.warning { color: var(--text); border: 1px solid color-mix(in srgb, var(--warning) 55%, transparent); border-left: 4px solid var(--warning);
           background: color-mix(in srgb, var(--warning) 9%, transparent); padding: var(--s2) var(--s3); border-radius: var(--r-sm); margin: var(--s2) 0; }
.warning b { color: var(--warning); }
.notice { border: 1px solid var(--edge); border-radius: var(--r); background: var(--panel); padding: var(--s4); margin: var(--s3) 0; max-width: 640px; }
.notice b { display: block; margin-bottom: var(--s1); font-size: 15px; }
.notice span { color: var(--muted); }
/* ---------- canvas (LAD / FBD) ---------- */
.canvas { overflow: auto; border: 1px solid var(--edge); border-radius: var(--r); background: var(--panel); padding: var(--s2) 0;
          background-image: radial-gradient(color-mix(in srgb, var(--wire) 22%, transparent) 1px, transparent 1px); background-size: 16px 16px; }
svg text { font: 12px var(--mono); fill: var(--operand); }
svg .pin { font-size: 11px; fill: var(--muted); }
svg .symbol { font-weight: bold; fill: var(--accent); }
svg .empty { fill: var(--muted); font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; }
svg .wire { stroke: var(--wire); stroke-width: 1.6; fill: none; stroke-linecap: square; }
svg .rail { stroke: var(--accent); stroke-width: 4; }
svg .el { stroke: var(--accent); stroke-width: 2; fill: none; stroke-linecap: round; }
svg .box { stroke: var(--accent); stroke-width: 1.6; fill: var(--panel); }
svg .mask { fill: var(--panel); stroke: none; }
svg .neg { fill: var(--panel); stroke-width: 1.6; }
svg .node { fill: var(--wire); stroke: none; }
svg .hit-pin { fill: transparent; cursor: pointer; }
svg g.d-changed text.without-changes { fill: var(--operand); font-weight: normal; }   /* on a changed box only the changed pins */
svg g.d-added .el, svg g.d-added .box { stroke: var(--added); stroke-width: 2.6; }
svg g.d-added text, svg g.d-added .symbol { fill: var(--added); font-weight: bold; }
svg g.d-changed .el, svg g.d-changed .box { stroke: var(--changed); stroke-width: 2.6; }
svg g.d-changed text, svg g.d-changed .symbol { fill: var(--changed); font-weight: bold; }
svg g.d-deleted .el, svg g.d-deleted .box { stroke: var(--deleted); stroke-width: 2.6; stroke-dasharray: 3 2; }
svg g.d-deleted text, svg g.d-deleted .symbol { fill: var(--deleted); text-decoration: line-through; }
pre, .rungs { font: 12px/1.6 var(--mono); white-space: pre-wrap; }
.rungs { padding: var(--s2) var(--s3); }
.rungs div { border-bottom: 1px dashed var(--edge); padding: 2px 0; }
ul.select { list-style: none; padding: 0; columns: 3 220px; }
ul.select li { padding: 2px 0; }
ul.select a { color: var(--text); text-decoration: none; } ul.select a:hover { color: var(--accent); }
.legend { font-size: 12px; color: var(--muted); display: flex; gap: var(--s3); align-items: center; flex-wrap: wrap; }
.legend span { display: inline-flex; gap: 5px; align-items: center; }
.legend span::before { content: ''; width: 10px; height: 10px; border-radius: 2px; background: currentColor; }
.legend .p { color: var(--added); } .legend .z { color: var(--changed); } .legend .s { color: var(--deleted); } .legend .e { color: var(--warning); }
/* ---------- states: chip + dot, stepper ---------- */
.s-Proposal { --sc: var(--s-Proposal); } .s-Approved { --sc: var(--s-Approved); } .s-Signed { --sc: var(--s-Signed); }
.s-Checked { --sc: var(--s-Checked); } .s-Uploaded { --sc: var(--s-Uploaded); } .s-Tested { --sc: var(--s-Tested); } .s-Disapproved { --sc: var(--s-Disapproved); }
.state { display: inline-flex; gap: 5px; align-items: center; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
         margin: 0 6px; border: 1px solid color-mix(in srgb, var(--sc) 60%, transparent); color: var(--sc);
         background: color-mix(in srgb, var(--sc) 12%, transparent); white-space: nowrap; line-height: 18px; }
.state::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--sc); }
.stepper { display: flex; align-items: center; gap: 0; list-style: none; margin: 0; padding: 0 0 0 var(--s3); position: relative;
           border-left: 4px solid var(--accent); flex-wrap: wrap; }   /* the left edge is the power rail */
.stepper li { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); padding: 6px 0; }
.stepper li + li::before { content: ''; width: 22px; height: 2px; background: var(--edge-strong); margin: 0 6px; }
.stepper li.done + li::before, .stepper li.current::before { background: var(--wire); }
.stepper .node { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--edge-strong); flex: none; }
.stepper li.done .node { background: var(--sc); border-color: var(--sc); }
.stepper li.done { color: var(--text); }
.stepper li.current { color: var(--sc); font-weight: 700; font-size: 13px; }
.stepper li.current .node { width: 16px; height: 16px; border-color: var(--sc); background: var(--sc);
                            box-shadow: 0 0 0 4px color-mix(in srgb, var(--sc) 25%, transparent); }
.flow { display: flex; gap: var(--s3); align-items: center; flex-wrap: wrap; margin: var(--s4) 0 0; }
/* ---------- edit page ---------- */
.edit-head { display: grid; gap: var(--s3); padding: var(--s4); background: var(--panel); border: 1px solid var(--edge);
             border-radius: var(--r); box-shadow: var(--shadow); margin-bottom: var(--s4); }
.header { color: var(--muted); margin: 0; font-size: 13px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.header b { color: var(--text); font-weight: 600; }
.header .state { margin: 0; }
.buttons { display: flex; gap: var(--s2); margin: 0; flex-wrap: wrap; align-items: center; }
.buttons .sep { width: 1px; align-self: stretch; background: var(--edge); margin: 0 var(--s1); }
.buttons button.tia { border-color: var(--accent); color: var(--accent); font-weight: 600; background: var(--accent-soft); }
.buttons button.danger { border-color: var(--deleted); color: var(--deleted); }
.buttons .fblock { font-size: 12px; color: var(--warning); }
details.disapprove { margin-top: var(--s2); font-size: 13px; }
details.disapprove textarea { display: block; width: min(640px, 100%); margin: var(--s1) 0; font: inherit; }
.disapproved { margin-top: var(--s2); white-space: pre-wrap; }
.progress { font-size: 12px; color: var(--muted); }
.mark-errors { color: var(--warning); font-weight: 600; }
details.panel { border: 1px solid var(--edge); border-radius: var(--r); background: var(--panel); margin: 0 0 var(--s3); }
details.panel > summary { list-style: none; cursor: pointer; display: flex; gap: var(--s2); align-items: center; padding: var(--s2) var(--s3);
                          font-weight: 600; font-size: 13px; border-radius: var(--r); }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary::before { content: ''; width: 6px; height: 6px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
                                  transform: rotate(-45deg); transition: transform .15s; margin: 0 4px 0 2px; flex: none; }
details.panel[open] > summary::before { transform: rotate(45deg); }
details.panel > summary .sum { color: var(--muted); font-weight: 400; font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.panel > summary .legend, details.panel > summary .end { margin-left: auto; }
details.panel > .body { padding: 0 var(--s3) var(--s3); font-size: 13px; }
details.panel > .body.canvas-body { padding: 0 var(--s2) var(--s2); }
details.panel > .body.canvas-body .canvas { border-radius: var(--r-sm); }
.checks > div { padding: 2px 0; }
.checks .ok { color: var(--added); font-weight: 600; } .checks .bad { color: var(--deleted); font-weight: 600; }
.writes ol { margin: 2px 0 var(--s2) 22px; padding: 0; color: var(--muted); font-size: 12px; }
.writes ol li.bad { color: var(--deleted); }
.procedure ol { margin: var(--s1) 0 0; padding-left: 22px; }
.procedure li { margin: var(--s1) 0; }
.procedure code { font: 12px var(--mono); color: var(--accent); background: var(--accent-soft); padding: 0 4px; border-radius: 3px; }
.procedure .header { margin-bottom: var(--s1); }
details.tia-settings .body input { font: 12px var(--mono); width: 150px; margin: 2px 6px 2px 2px; }
details.tia-settings .body label { color: var(--muted); font-size: 12px; }
/* ---------- editor ---------- */
.main.edit { grid-template-columns: 290px 1fr 260px; }
#palette { border-left: 1px solid var(--edge); border-right: 0; }
#palette input { width: calc(100% - 24px); margin: var(--s1) var(--s3) var(--s2); }
#palette .item { display: flex; gap: var(--s2); align-items: center; padding: 4px var(--s3); cursor: grab; border-left: 3px solid transparent;
               white-space: nowrap; overflow: hidden; }
#palette .item:hover { background: var(--select); }
#palette .item.active { border-left-color: var(--accent); background: var(--select); }
#palette .item b { font: 600 12px var(--mono); color: var(--accent); min-width: 58px; }
#palette .item span { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
#palette .item .glyph { flex: none; width: 28px; height: 16px; }
#palette .glyph * { stroke: var(--accent); stroke-width: 1.5; fill: none; }
#palette .glyph text { fill: var(--accent); stroke: none; font: bold 8px var(--mono); }
#palette .empty { color: var(--muted); padding: 0 var(--s3); font-size: 12px; }
.tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 0 0 var(--s2); }
.tools .sep { width: 1px; height: 22px; background: var(--edge); margin: 0 var(--s1); }
.tools button.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.tools input { font-size: 13px; padding: 4px 8px; width: 110px; }
.tools label { color: var(--muted); font-size: 13px; }
.mode { color: var(--accent); font-size: 13px; min-height: 20px; margin: 0 0 var(--s2); }
.mode.message { color: var(--added); }
svg .place { fill: var(--accent); fill-opacity: .3; stroke: var(--accent); stroke-width: 2; cursor: pointer; }
svg .place:hover, svg .place.near { fill-opacity: .95; }
svg .place.chosen { fill: var(--changed); stroke: var(--changed); fill-opacity: .95; }
svg .hit { fill: transparent; cursor: pointer; }
svg g[data-id]:hover > .hit { fill: var(--accent); fill-opacity: .06; }
svg .frame-select { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 3; }
svg .frame-error { fill: color-mix(in srgb, var(--warning) 10%, transparent); stroke: var(--warning); stroke-width: 2; }
.editor-bottom { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(300px, 1.2fr); gap: var(--s4); margin-top: var(--s3); }
.editor-bottom > div { min-width: 0; border: 1px solid var(--edge); border-radius: var(--r); background: var(--panel); padding: var(--s3); }
.editor-bottom h3 { font-size: 13px; font-weight: 600; margin: 0 0 var(--s2); }
.errors div { color: var(--warning); padding: 3px 0; cursor: pointer; font-size: 13px; }
.errors .ok { color: var(--added); cursor: default; }
.errors .var { color: var(--muted); }
.properties table { border-collapse: collapse; width: 100%; font-size: 13px; table-layout: fixed; }
.properties td { padding: 3px 6px 3px 0; }
.properties td:first-child { color: var(--muted); font-family: var(--mono); white-space: nowrap; width: 96px; overflow: hidden; text-overflow: ellipsis; }
.properties input, .properties select { width: 100%; font: 13px var(--mono); padding: 3px 6px; }
.properties .section td { color: var(--accent); font-family: inherit; font-weight: 600; padding-top: var(--s2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: auto; }
.iface { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4); padding: var(--s2) var(--s1); }
.iface h3 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 var(--s1); }
.iface table { width: 100%; border-collapse: collapse; font: 12px/1.5 var(--mono); }
.iface th { text-align: left; color: var(--muted); font: 600 11px "Segoe UI", system-ui, sans-serif; padding: 2px 6px; border-bottom: 1px solid var(--edge); }
.iface td { padding: 2px 6px; border-bottom: 1px dashed var(--edge); overflow-wrap: anywhere; }
.iface tr.added td { color: var(--added); font-weight: 700; background: color-mix(in srgb, var(--added) 8%, transparent); }
.iface .other { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.texts > div { padding: 2px 0; } .texts .old { color: var(--deleted); text-decoration: line-through; } .texts .new { color: var(--added); }
.texts .hint { display: inline-block; min-width: 70px; }
.tools input.wide { width: 260px; }
.tree details.grp > summary { list-style: none; cursor: pointer; display: flex; gap: 6px; align-items: center; padding: 3px var(--s3) 3px 22px;
                             font-size: 12px; white-space: nowrap; overflow: hidden; }
.tree details.grp > summary::-webkit-details-marker { display: none; }
.tree details.grp > summary::before { content: '▸'; color: var(--muted); } .tree details.grp[open] > summary::before { content: '▾'; }
.tree details.grp > summary a { padding: 0; border: 0; display: inline; font-weight: 600; }
.tree details.grp > summary .state { margin: 0; }
.tree details.grp.active > summary { background: var(--select); }
.tree details.grp a.u4 .c { min-width: 0; }
.group-of { font-size: 12px; color: var(--muted); }
.members > div { display: flex; gap: var(--s2); align-items: baseline; padding: 4px 0; border-bottom: 1px dashed var(--edge); flex-wrap: wrap; }
.members .n { font: 12px var(--mono); color: var(--muted); min-width: 18px; }
.members .state { margin: 0; }
.procedure h4 { margin: var(--s3) 0 0; font-size: 13px; }
/* ---------- edit tree ---------- */
.tree { padding-bottom: var(--s2); border-bottom: 1px solid var(--edge); }
.tree .u0, .tree .u1, .tree .u2 { padding: 3px var(--s3); color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tree .u0 { color: var(--text); font-weight: 600; font-size: 13px; }
.tree .u1 { padding-left: 22px; }
.tree .u2 { padding-left: 32px; font-family: var(--mono); }
.tree a.u3 { padding-left: 42px; }
.tree a.u4 { padding-left: 54px; }
.tree a.u4 .state { margin: 0 2px; }
.tree a.u4 .note { overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.tree a.u4.active .note { color: var(--text); }
.tree .empty { padding: 3px var(--s3); color: var(--muted); font-size: 12px; margin: 0; }
/* ---------- home ---------- */
.main.home { grid-template-columns: 1fr; }
.main.home #nw { display: none; }
.home { max-width: 1120px; margin: 0 auto; }
.hero { padding: var(--s3) 0 var(--s4); }
.hero h1 { font-size: 24px; letter-spacing: -.01em; margin-bottom: var(--s2); }
.hero p { color: var(--muted); margin: 0; max-width: 72ch; font-size: 15px; }

    else if (p.type.startsWith('coil') || p.type === 'ret') coil(g, d, p);
    else if (p.type === 'comparison') comparison(g, d, p);
    else if (p.type === 'not') negate(g, d);
    else box(g, d, p, (net.pin_diff || {})[d.id]);
  }
  el(svg, 'line', {class: 'rail', x1: k.rail.x, y1: k.rail.y1, x2: k.rail.x, y2: k.rail.y2});
  if (k.empty) el(svg, 'text', {x: k.rail.x + 14, y: k.height / 2 + 4, class: 'empty'}, 'Empty network — nothing to draw.');

}
function elementDescription(p) {
  if (!p) return '?';
  if (p.type === 'box') return `[${p.instance ? p.instance + ' ' : ''}${p.name}(${p.inputs.map(x => x.pin + ':=' + x.operand).concat(p.outputs.map(x => x.pin + '=>' + x.operand)).join(', ')})]`;
  if (p.type === 'comparison') return `|${p.in1} ${p.op} ${p.in2}|`;
  const sym = {contact: '| |', contact_nc: '|/|', contact_p: '|P|', contact_n: '|N|', coil: '( )', coil_s: '(S)',

}
function rungList(net) {
  const elements = Object.fromEntries(net.elements.map(p => [p.id, p]));
  const div = document.createElement('div');
  div.className = 'rungs';
  for (const r of net.rungs) {
    const parts = [r.from].concat(r.path.map(c => c.startsWith('wire#') ? '● ' + c.slice(5) : elementDescription(elements[c])));
    if (r.to) parts.push('→ ' + r.to);
    const d = document.createElement('div');
    d.textContent = parts.join('  —  ');
    div.appendChild(d);
  }
  return div;
}

const enc = encodeURIComponent;

// edit tree: project → round → block → NW → edit
function treeHtml(st, activeId) {
  let h = '<h2>Edits</h2><div class="tree">';
  if (!st.projects.length) h += '<p class="empty">No edits yet — open a network and press Propose edit, or let an AI agent propose one.</p>';
  const group = (field, key) => {
    const m = new Map();
    for (const x of field) { const k = key(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }
    return m;
  };
  for (const p of st.projects) {
    h += `<div class="u0">${esc(p.project)}</div>`;
    const groups = group(p.edits.filter(u => u.group).sort((a, b) => a.group.order - b.group.order), u => u.group.id);
    for (const [gid, ug] of [...groups].sort()) {
      const low = ug.some(u => u.state === 'Disapproved') ? 'Disapproved' : STATES[Math.min(...ug.map(u => STATES.indexOf(u.state)))];
      const on = gid === activeId || ug.some(u => u.id === activeId);
      h += `<details class="grp${gid === activeId ? ' active' : ''}"${on ? ' open' : ''}><summary><a class="c" href="?group=${enc(gid)}">${esc(gid)}</a>` +
           `<span class="note">${esc(ug[0].group.name || `${ug.length} edits`)}</span><span class="state s-${esc(low)}">${esc(low)}</span></summary>` +
           ug.map(u => `<a class="u4 ${u.id === activeId ? 'active' : ''}" href="?edit=${enc(u.id)}" title="${esc(editWhere(u))}"><span class="c">${esc(u.id)}</span>` +
                       `<span class="state s-${esc(u.state)}">${esc(u.state)}</span><span class="note">${esc(editWhere(u))}</span></a>`).join('') + `</details>`;
    }
    for (const [, uk] of group(p.edits.filter(u => !u.group), u => String(u.round ?? '').trim().toLowerCase())) {
      h += `<div class="u1">Round: ${esc(String(uk[0].round ?? '').trim())}</div>`;
      for (const [block, ub] of group(uk, u => u.block)) {
        const u0 = ub[0];
        h += `<div class="u2">${esc(u0.block_kind || '')}${u0.block_number ?? ''} "${esc(block)}"</div>`;
        const nws = [...group(ub, treeKey)].sort((a, b) => treeOrder(a[1][0]) - treeOrder(b[1][0]));
        for (const [, un] of nws) {
          const x = un[0];
          h += !x.kind || x.kind === 'network'
            ? `<a class="u3" href="?project=${enc(p.project)}&block=${enc(block)}&nw=${x.nw}"><span class="c">NW ${x.nw}</span>${esc(x.title || '')}</a>`
            : `<a class="u3" href="?edit=${enc(x.id)}">${whereHtml(x)}</a>`;
          for (const u of un) {
            h += `<a class="u4 ${u.id === activeId ? 'active' : ''}" href="?edit=${enc(u.id)}"><span class="c">${esc(u.id)}</span>` +
                 `<span class="state s-${esc(u.state)}">${esc(u.state)}</span><span class="note">${esc(u.note || '')}</span></a>`;
          }
        }
      }
    }
  }
  return h + '</div>';
}
// editWhere(u) with the part before the first colon in the code style
function whereHtml(u) {
  const [head, ...rest] = editWhere(u).split(':');
  return `<span class="c">${esc(head)}:</span>${esc(rest.join(':'))}`;
}
function editTitleHtml(u) {

// what an edit changes: "NW 2: title", "Interface: +4 Static", "NW 3+ (new): title"
function editWhere(u) {
  if (u.kind === 'interface') return `Interface: +${(u.members || []).length} ${u.section}`;
  if (u.kind === 'new_network') return `NW ${u.after_nw}+ (new): ${u.title || ''}`;
  if (u.kind === 'hmi_screen') return `Screen: ${u.screen}${u.new ? ' (new)' : ''}`;
  return `NW ${u.nw}: ${u.title || ''}${u.title_after ? ' → ' + u.title_after : ''}`;
}
const treeKey = u => ['interface', 'new_network', 'hmi_screen'].includes(u.kind) ? u.kind + ':' + u.id : 'nw:' + u.nw;
const treeOrder = u => u.kind === 'interface' || u.kind === 'hmi_screen' ? -1 : u.kind === 'new_network' ? u.after_nw + 0.5 : u.nw;
let lastState = {projects: []};
async function loadTree(activeId) {
  try { lastState = await api('/api/state'); return treeHtml(lastState, activeId); }

function networksHtml(b, nw, url) {

    `<a class="${n.nw === nw ? 'active' : ''}" href="${url(n.nw)}"><span class="c">NW ${n.nw}</span>${esc(n.title || '')}` +
    `${n.language !== 'LAD' ? `<span class="j">${esc(n.language || '?')}</span>` : ''}</a>`).join('');

function canvas(m, net, diff) {
  if (net.drawing) {
    const pl = document.createElement('div');
    pl.className = 'canvas';
    pl.appendChild(draw(net, diff));
    m.appendChild(pl);

    m.appendChild(rungList(net));

    const pre = document.createElement('pre');
    pre.textContent = net.text;
    m.appendChild(pre);
  }
}

    try { await api('/api/check', 'POST', {edit_id: u.id, match, export_ts: '', note: 'by hand: ' + note}); await showEdit(uid); }
    catch (e) { await showEdit(uid, e.message); }
  };
  armDelete('del-edit', `/api/edits/${enc(u.id)}`, () => { location.href = u.group ? `?group=${enc(u.group.id)}` : `?project=${enc(u.project)}`; });
  for (const b of m.querySelectorAll('button[data-state]')) {
    b.onclick = async () => {
      try { await api(`/api/edits/${enc(u.id)}/state`, 'POST', {state: b.dataset.state, by: 'user'}); await showEdit(uid); }
      catch (e) { await showEdit(uid, e.message); }
    };
  }
  if ($('model')) canvas($('model'), d, d.diff);
  if ($('hmi-model')) $('hmi-model').appendChild(hmiFrame(u.after, $('hmi-model').clientWidth || 900, u.new ? {} : hmiMarks(d.screen_diff), d.ghosts));
  try { procedurePanel(await api(`/api/edits/${enc(u.id)}/procedure`)); } catch (e) { /* no TIA steps */ }
}
const DELETABLE = ['Proposal', 'Approved', 'Disapproved'];      // not yet written to TIA
// two clicks instead of a browser dialog: the first one asks, the second one deletes
function armDelete(id, path, done, ask = 'Click again to delete') {
  const b = $(id);
  if (b) b.onclick = async () => {
    if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = ask; return; }
    try { await api(path, 'DELETE'); done(); } catch (e) { b.textContent = '⚠ ' + e.message; }
  };
}
// Disapproved: a person rejects a Proposal / Approved edit with a reason the AI reads (get_edit) to propose a fix
function disapproveHtml(st, last) {
  return (['Proposal', 'Approved'].includes(st) ? `<details class="disapprove"><summary>Disapprove…</summary>` +
      `<textarea id="dis-reason" rows="3" placeholder="why it is rejected — the AI reads it and proposes a fix"></textarea>` +
      `<button id="dis-send">Disapprove</button></details>` : '') +
    (last ? `<div class="${st === 'Disapproved' ? 'warning' : 'hint'} disapproved"><b>${st === 'Disapproved' ? '✗ Disapproved' : 'Last disapproved'}</b> ` +
      `by ${esc(last.by)} · ${esc(last.time.replace('T', ' '))}: ${esc(last.reason)}</div>` : '');
}
function onDisapprove(path, reload) {
  if ($('dis-send')) $('dis-send').onclick = async () => {
    const reason = $('dis-reason').value.trim();
    if (!reason) { $('dis-reason').focus(); return; }
    try { await api(path, 'POST', {state: 'Disapproved', reason, by: 'user'}); await reload(); }
    catch (e) { await reload(e.message); }
  };
}
// ---------- E5: a group of edits = one change ----------
async function showGroup(gid, message) {
  const g = await api(`/api/groups/${enc(gid)}`);
  $('info').textContent = `${g.project} · group ${g.id}`;
  document.title = `BetterTIA Editor — group ${g.id}`;
  $('nw').innerHTML = await loadTree(g.id);
  const at = STATES.indexOf(g.state);
  $('content').innerHTML = `<div class="edit-head">` +
    `<h1><span class="c">${esc(g.id)}</span> ${esc(g.name || 'group of edits')}</h1>` +
    `<div class="header"><span class="state s-${esc(g.state)}">${esc(g.state)}</span> ${g.members.length} edits · ${g.blocks.map(esc).join(', ')} · the group state is the lowest state of its members</div>` +
    (g.f ? `<div class="warning"><b>⚠ F-block:</b> ${esc(g.f_note)}. No Upload — make the members by hand following the TIA steps.</div>` : '') +
    `<div class="buttons">` +
    (g.previous ? `<button data-gstate="${esc(g.previous)}">← ${esc(g.previous)}</button>` : '') +
    `<ol class="stepper" aria-label="state">${STATES.map((x, i) => `<li class="s-${x}${i < at ? ' done' : i === at ? ' current' : ''}"><span class="node"></span>${x}</li>`).join('')}</ol>` +
    (g.next ? `<button class="forward" data-gstate="${esc(g.next)}" title="moves every member; refused when one of them cannot move">${esc(g.next)} →</button>` : '') +
    `</div><div class="buttons">` +

    `<button id="g-check" title="export check of every member">Check export (all members)</button>` +
    `<button id="g-ungroup" title="the edits stay, each with its own state">Ungroup</button>` +
    (g.members.every(m => DELETABLE.includes(m.state)) ? `<button id="g-delete" class="danger" title="deletes the group and all its edits; only before they are written to TIA">Delete group and edits</button>` : '') +
    `<span class="progress" id="progress"></span></div>` +
    disapproveHtml(g.state, null) + `</div>` +
    (message ? `<div class="warning"><b>⚠ ${esc(message)}</b></div>` : '') +
    `<details class="panel" open><summary>Members <span class="sum">in the order they are made</span></summary><div class="body members">` +
    g.members.map(m => `<div><span class="n">${m.order}.</span><a class="c" href="?edit=${enc(m.id)}">${esc(m.id)}</a><span class="state s-${esc(m.state)}">${esc(m.state)}</span>` +
      `<b>${esc(m.where)}</b>${m.f ? '<span class="fblock">F</span>' : ''}<span class="hint">${esc(m.note)}</span>` +
      (m.state === 'Approved' ? `<button class="small" data-signed="${esc(m.id)}" title="the member was written another way (by hand, XML import…) → Signed; then Check it">Written by hand → Signed</button>` : '') +
      `</div>`).join('') + `</div></details>` +
    `<details class="panel" id="procedure-panel" open hidden><summary>TIA steps <span class="sum">all members, in order</span>` +
    `<span class="end"><button id="procedure-copy" class="small" title="copies the markdown">Copy</button></span></summary><div class="body checks procedure" id="procedure"></div></details>`;
  for (const b of document.querySelectorAll('button[data-gstate]')) b.onclick = async () => {
    try { await api(`/api/groups/${enc(gid)}/state`, 'POST', {state: b.dataset.gstate, by: 'user'}); await showGroup(gid); }
    catch (e) { await showGroup(gid, e.message); }
  };
  onDisapprove(`/api/groups/${enc(gid)}/state`, x => showGroup(gid, x));
  // E6: after a failed group Upload, members written another way are marked one by one
  for (const b of document.querySelectorAll('button[data-signed]')) b.onclick = async () => {
    try { await api(`/api/edits/${enc(b.dataset.signed)}/state`, 'POST', {state: 'Signed', by: 'user (written by hand)'}); await showGroup(gid); }
    catch (e) { await showGroup(gid, e.message); }
  };
  armDelete('g-ungroup', `/api/groups/${enc(gid)}`, () => { location.href = `?project=${enc(g.project)}`; }, 'Click again to ungroup');
  armDelete('g-delete', `/api/groups/${enc(gid)}?edits=1`, () => { location.href = `?project=${enc(g.project)}`; });
  const run = (id, path, text, done) => { if ($(id)) $(id).onclick = async () => {
    for (const b of $('content').querySelectorAll('.buttons button')) b.disabled = true;
    $('progress').textContent = text;

    catch (e) { await showGroup(gid, e.message); }
  }; };
  run('g-upload', 'upload', 'Upload: TIAC_Writer is writing the members one by one…',
      x => x.ok ? null : 'Upload stopped: ' + x.results.map(z => `${z.edit} ${z.ok ? '✓' : '✗ ' + z.message}`).join(' · ') +
        ' — a member written another way: "Written by hand → Signed" in the list, then Check.');
  run('g-check', 'check-export', 'Checking the newest exports…',
      x => x.match ? null : 'Check: ' + x.results.map(z => `${z.edit} ${z.match ? 'match' : z.note}`).join(' · '));

      catch (err) { $('procedure-copy').textContent = 'Cannot copy'; }
    };
  } catch (e) { /* no TIA steps */ }
}

// E2: interface edit — the edited section before / after, the other sections as counts
function interfaceHtml(x) {
  const table = rows => `<table><tr><th>Name</th><th>Data type</th><th>Start value</th><th>Comment</th></tr>` +
    (rows.length ? rows.map(m => `<tr class="${m.added ? 'added' : ''}"><td>${m.added ? '+ ' : ''}${esc(m.name)}</td><td>${esc(m.type)}</td>` +
      `<td>${esc(m.initial || '')}</td><td>${esc(m.comment || '')}</td></tr>`).join('') : '<tr><td colspan="4">(empty)</td></tr>') + `</table>`;
  const other = Object.entries(x.before).filter(([k]) => k !== x.section).map(([k, v]) => `${k} ${v.length}`);
  return `<div class="iface"><div><h3>Before (export)</h3>${table(x.before[x.section] || [])}</div>` +
    `<div><h3>After</h3>${table(x.after[x.section] || [])}</div>` +
    (other.length ? `<div class="other">Other sections unchanged: ${esc(other.join(' · '))}</div>` : '') + `</div>`;
}
// F2: TIA steps (markdown -> list), with copy to clipboard
function md(t) {
  return esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
}
function procedurePanel(p) {
  const el_ = $('procedure');
  if (!el_) return;
  el_.innerHTML = `<div class="header"><b>${esc(p.header)}</b></div><ol>${p.steps.map(k => `<li>${md(k)}</li>`).join('')}</ol>`;

    catch (e) { $('procedure-copy').textContent = 'Cannot copy'; }
  };
}

// ---------- D3: changelog of a project ----------
const KIND_TEXT = {proposed: 'proposed', state: 'state', upload: 'upload', write: 'write', check: 'check', snapshot: 'snapshot'};
async function showChangelog(project) {
  $('info').textContent = project;

  const f = {state: q.get('state') || '', block: q.get('block_filter') || ''};

  const days = new Map();

    `<div class="tools"><label>State <select id="log-state"><option value="">all</option>${[...STATES, 'Disapproved'].map(x => `<option ${x === f.state ? 'selected' : ''}>${x}</option>`).join('')}</select></label>` +
    `<label>Block <select id="log-block"><option value="">all</option>${blocks.map(b => `<option ${b === f.block ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select></label>` +
    `<span class="sep"></span><button id="log-copy" title="the same list as a Markdown table per day">Copy as Markdown</button><span class="hint" id="log-copied"></span></div>` +
    (r.items.length ? [...days].reverse().map(([d, xs]) => `<details class="panel" open><summary>${esc(d)} <span class="sum">${xs.length} event${xs.length === 1 ? '' : 's'}</span></summary>` +
      `<div class="body log">${xs.map(row).join('')}</div></details>`).join('')
      : `<div class="notice"><b>Nothing here yet</b><span>${f.state || f.block ? 'No events match the filter.' : 'Propose an edit or take a snapshot — every step is recorded.'}</span></div>`);

    } catch (e) { $('log-copied').textContent = 'Cannot copy: ' + e.message; }

// ---------- D3: versions — two snapshots compared, block → network → drawn difference ----------
async function showVersions(project) {
  $('info').textContent = project;
  document.title = `BetterTIA Editor — ${project} versions`;
  const snaps = (await api(`/api/projects/${enc(project)}/snapshots`)).snapshots;   // newest first
  const to = q.get('to') || snaps[0]?.ts, from = q.get('from') || (snaps[1] || snaps[0])?.ts;
  const opt = sel => snaps.map(x => `<option value="${esc(x.ts)}" ${x.ts === sel ? 'selected' : ''}>${esc(x.time.replace('T', ' '))} · ` +
    `${x.full ? `full, ${x.block_count} blocks` : `partial: ${esc(x.blocks.join(', '))}`}</option>`).join('');
  let h = projectTabs(project, 'versions') + `<h1>Versions <span class="c">${esc(project)}</span></h1>` +
    `<p class="comment">Every snapshot is a copy of the project. Compare two of them — no TIA Portal needed. A partial export ` +
    `(from Check) is laid over the full snapshot before it.</p>` +
    `<div class="tools"><label>From <select id="v-from">${opt(from)}</select></label><span>→</span>` +
    `<label>To <select id="v-to">${opt(to)}</select></label></div>`;
  if (snaps.length < 2) { $('content').innerHTML = h + `<div class="notice"><b>One snapshot only</b><span>Take another snapshot to compare.</span></div>`; return; }
  const r = await api(`/api/projects/${enc(project)}/compare?from=${enc(from)}&to=${enc(to)}`);
  const key = (b, n) => `${b.block}:${n.nw_from ?? ''}:${n.nw_to ?? ''}`;
  const all = r.blocks.flatMap(b => b.networks.map(n => [b, n]));
  const chosen = all.find(([b, n]) => key(b, n) === q.get('sel')) || all.find(([, n]) => n.status !== 'moved') || all[0];
  const nwText = n => n.nw_from && n.nw_to ? (n.nw_from === n.nw_to ? `NW ${n.nw_to}` : `NW ${n.nw_from} → NW ${n.nw_to}`) : `NW ${n.nw_to || n.nw_from}`;
  h += r.blocks.length ? r.blocks.map(b => `<details class="panel" open><summary><span class="c">${esc(b.kind || '')}${b.number ?? ''}</span> "${esc(b.block)}"` +
      `<span class="log"><span class="k ${esc(b.status)}">${esc(b.status)}</span></span><span class="sum">${esc(b.from_ts || '—')} → ${esc(b.to_ts || '—')}` +
      `${b.notes.length ? ' · ' + esc(b.notes.join(' · ')) : ''}</span></summary><div class="body log">` +
      (b.networks.length ? b.networks.map(n => `<div class="${chosen && chosen[1] === n ? 'active' : ''}">` +
        `<a class="nw" href="${link({from, to, sel: key(b, n)})}"><span class="c">${nwText(n)}</span><b>${esc(n.title || '(no title)')}</b>` +
        `<span class="k ${esc(n.status)}">${esc(n.status)}</span>${n.language !== 'LAD' ? `<span class="hint">${esc(n.language || '?')}</span>` : ''}</a>` +
        n.matches.map(id => `<a class="match" href="?edit=${enc(id)}" title="the network in this snapshot is the &quot;after&quot; of the edit">matches edit ${esc(id)}</a>`).join('') +
        (n.diffs.length || n.notes.length ? `<span class="diffs">${esc(n.notes.concat(n.diffs).join(' · '))}</span>` : '') + `</div>`).join('')
        : '<div class="hint">No network changed.</div>') + `</div></details>`).join('')
    : `<div class="notice"><b>No differences</b><span>The two snapshots have the same blocks and networks.</span></div>`;
  if (chosen) h += `<details class="panel" open><summary>Difference <span class="sum">${esc(chosen[0].block)} · ${nwText(chosen[1])}: ${esc(chosen[1].title || '(no title)')}</span>` +
    `<span class="legend"><span class="p">added</span><span class="z">changed</span><span class="s">deleted</span></span></summary><div class="body canvas-body" id="v-canvas"></div></details>`;
  $('content').innerHTML = h;
  const go = () => { location.href = link({from: $('v-from').value, to: $('v-to').value, sel: null}); };
  $('v-from').onchange = go; $('v-to').onchange = go;
  if (!chosen) return;
  const [b, n] = chosen, w = canvasWidth();
  const get = (ts, nw) => nw ? api(`/api/network?project=${enc(project)}&block=${enc(b.block)}&nw=${nw}&ts=${enc(ts)}&width=${w}`) : null;
  const [x, y] = await Promise.all([get(b.from_ts, n.nw_from), get(b.to_ts, n.nw_to)]);
  const model = v => v.language === 'FBD' ? {language: 'FBD', elements: v.elements} : {elements: v.elements, rungs: v.rungs};
  if (x && y && x.drawing && y.drawing && x.language === y.language) {     // the same diff as an edit, ids paired by content
    const d = await api('/api/layout', 'POST', {project, before: model(x), after: model(y), align: true, width: w});
    canvas($('v-canvas'), d, d.diff);
  } else {
    const v = y || x;
    canvas($('v-canvas'), v, v.drawing ? Object.fromEntries(v.elements.map(p => [p.id, y ? 'added' : 'deleted'])) : {});
  }
}

// ---------- H1: HMI screens (WinCC Unified) — view ----------
const HMI_TYPES = ['Text', 'Rectangle', 'Line', 'Button', 'IOField', 'Switch', 'Bar', 'Gauge', 'AlarmControl', 'ScreenWindow'];
// one screen item as an absolutely placed div in screen pixels (the frame scales the whole screen)
function hmiItem(x) {
  const c = x.colors || {}, f = x.font || {}, d = document.createElement('div');
  const pv = (x.bindings || []).find(b => b.property === 'ProcessValue');
  d.className = 'hi t-' + x.type + (HMI_TYPES.includes(x.type) ? '' : ' other');
  d.dataset.name = x.name;
  d.title = `${x.name} (${x.type})`;
  Object.assign(d.style, {left: x.left + 'px', top: x.top + 'px', width: x.width + 'px', height: x.height + 'px',
                          fontSize: f.size ? f.size + 'px' : '', fontWeight: /bold/i.test(f.weight || '') ? 700 : '',
                          color: c.foreColor || c.textColor || '', background: ['Line', 'Gauge'].includes(x.type) ? '' : c.backColor || '',
                          border: c.borderColor && !['Text', 'Line'].includes(x.type) ? `1px solid ${c.borderColor}` : ''});
  if (x.visible === false) d.style.opacity = .35;
  const t = esc(x.text || '');
  const vertical = x.height > x.width;
  d.innerHTML = {
    Text: t, Button: t, Rectangle: '',
    IOField: (pv ? `<i>${esc(pv.tag)}</i>` : '') + '0.0',
    Switch: `<span style="background:${esc(c.foreColor || '#2f6fa3')}"></span>`,
    Bar: `<b style="background:${esc(c.foreColor || '#2f6fa3')};${vertical ? 'width:100%;height:60%' : 'height:100%;width:60%'}"></b>`,
    Gauge: `<svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="50" cy="50" r="46" fill="${esc(c.backColor || '#fff')}" stroke="#8a9199" stroke-width="2"/>` +
           `<path d="M20 74 A38 38 0 1 1 80 74" fill="none" stroke="${esc(c.foreColor || '#1b2430')}" stroke-width="4"/><line x1="50" y1="50" x2="30" y2="28" stroke="#c0392b" stroke-width="3"/></svg>`,
    Line: `<svg width="${Math.max(x.width, 1)}" height="${Math.max(x.height, 1)}" style="overflow:visible;position:absolute;left:0;top:0"><line x1="0" y1="0" x2="${x.width}" y2="${x.height}" stroke="${esc(c.lineColor || c.foreColor || '#1b2430')}" stroke-width="2"/></svg>`,
    AlarmControl: '<div><span>Time</span><span>Alarm text</span><span>State</span></div>' + '<div><span>&nbsp;</span><span></span><span></span></div>'.repeat(3),
    ScreenWindow: 'Screen window ' + esc(x.name),
  }[x.type] ?? `${esc(x.type)} ${esc(x.name)}`;
  if (x.type === 'Line') d.style.overflow = 'visible';
  return d;
}
// the screen in a frame of the given width; marks: {item name: 'added' | 'changed' | 'deleted'}; ghosts: deleted items drawn faded
function hmiFrame(s, width, marks = {}, ghosts = []) {
  const k = Math.min(1, width / s.width), wrap = document.createElement('div'), scr = document.createElement('div');
  wrap.className = 'hmi-wrap';
  Object.assign(wrap.style, {width: s.width * k + 'px', height: s.height * k + 'px'});
  scr.className = 'hmi-screen';
  Object.assign(scr.style, {width: s.width + 'px', height: s.height + 'px', transform: `scale(${k})`, background: s.background || '#ffffff'});
  for (const x of s.items.concat(ghosts)) {
    const d = hmiItem(x);
    if (marks[x.name]) d.classList.add('d-' + marks[x.name]);
    scr.appendChild(d);
  }
  wrap.appendChild(scr);
  wrap.scale = k;
  return wrap;
}
function hmiProps(x) {
  if (!x) return '<p class="comment">Click an item on the screen.</p>';
  const row = (k, v) => `<tr><td>${esc(k)}</td><td>${v}</td></tr>`;
  return `<table><colgroup><col style="width:96px"><col></colgroup><tr class="section"><td colspan="2">${esc(x.name)} · ${esc(x.type)}</td></tr>` +
    row('position', `${x.left}, ${x.top}`) + row('size', `${x.width} × ${x.height}`) +
    (x.text != null ? row('text', esc(x.text)) : '') +
    Object.entries(x.colors || {}).map(([k, v]) => row(k, `<span class="swatch" style="background:${esc(v)}"></span>${esc(v)}`)).join('') +
