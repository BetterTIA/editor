  const inp = (key, val, type = 'text', extra = '') => `<input data-k="${key}" type="${type}" value="${esc(val ?? '')}" ${extra} autocomplete="off">`;
  const row = (label, html) => `<tr><td>${esc(label)}</td><td>${html}</td></tr>`;
  const colors = [...new Set(Object.keys(x.colors || {}).concat(x.type === 'Line' ? ['lineColor'] : ['backColor', 'foreColor', 'borderColor']))];
  v.innerHTML = `<table><colgroup><col style="width:96px"><col></colgroup><tr class="section"><td colspan="2">${esc(x.type)}</td></tr>` +
    row('name', inp('name', x.name)) + row('text', inp('text', x.text)) +
    ['left', 'top', 'width', 'height'].map(g => row(g, inp(g, x[g], 'number', 'step="8"'))).join('') +
    row('font size', inp('font.size', x.font?.size, 'number', 'min="1"')) +
    colors.map(c => row(c, /^#[0-9a-f]{6}$/.test(x.colors?.[c] || '#000000') ? inp('colors.' + c, x.colors?.[c] || '#000000', 'color', 'style="height:26px;padding:1px"')
                                                                          : inp('colors.' + c, x.colors[c]))).join('') +
    `<tr class="section"><td colspan="2">Tag bindings</td></tr>` +
    (x.bindings || []).concat([{property: defaultProperty(x.type), tag: ''}]).map((z, i) =>
      `<tr><td><input data-b="${i}" data-f="property" value="${esc(z.property)}"></td><td><input data-b="${i}" data-f="tag" value="${esc(z.tag)}" list="operands" placeholder="HMI or PLC tag" autocomplete="off"></td></tr>`).join('') +
    ((x.events || []).length ? `<tr class="section"><td colspan="2">Events</td></tr>` + row('', x.events.map(e => esc(e.event)).join(', ')) : '') + '</table>';
  for (const i of v.querySelectorAll('[data-k]')) i.onchange = () => hmiSet(x, i.dataset.k, i.type === 'number' ? (i.value === '' ? null : +i.value) : i.value);
  for (const i of v.querySelectorAll('[data-b]')) i.onchange = () => {
    hmiPush();
    const list = x.bindings = x.bindings || [], n = +i.dataset.b;
    list[n] = list[n] || {property: defaultProperty(x.type), tag: ''};
    list[n][i.dataset.f] = i.value.trim();
    x.bindings = list.filter(z => z.property && z.tag);
    hmiRender();
  };
}

// ---------- M3: editor ----------
const ed = {u: null, before: null, after: null, hist: [], redo: [], select: null, insert: null, branch: null, res: null,
            cat: null, changed: false, fbd: false, f: false, input: null};
const errorCount = (n, j) => `${n} ${j || 'LAD'} ${n === 1 ? 'error' : 'errors'}`;
const KIND = p => ed.fbd ? 'fbd' : /^coil|^ret$/.test(p.type) ? 'coil' : p.type === 'box' ? 'box' : 'contact';
const LANG = () => ed.fbd ? 'FBD' : 'LAD';

async function editor(uid) {
  const d = await api(`/api/edits/${enc(uid)}`);
  const u = d.edit;
  if (u.state !== 'Proposal') { await showEdit(uid, `Only a proposal in state Proposal can be edited (now ${u.state}).`); return; }
  if (u.kind === 'interface') { await showEdit(uid, 'An interface edit has no canvas — change its members with update_edit (MCP) or POST /api/edits/<id>/after.'); return; }
  if (u.kind === 'hmi_screen') { await hmiEditor(d); return; }
  const fbd = u.after.language === 'FBD';
  Object.assign(ed, {u, fbd, f: !!u.f, input: null,
                     before: u.kind === 'new_network' ? (fbd ? {language: 'FBD', elements: []} : {elements: [], rungs: []})
                           : fbd ? {language: 'FBD', elements: u.before.elements} : {elements: u.before.elements, rungs: u.before.rungs},
                     after: fbd ? {language: 'FBD', elements: u.after.elements} : {elements: u.after.elements, rungs: u.after.rungs},
                     hist: [], redo: [], select: null, insert: null, branch: null, changed: false});
  ed.cat = await api(`/api/catalog?project=${enc(u.project)}`);
  $('info').textContent = `${u.project} · editing ${u.id} · base export ${u.before.export_ts}`;
  document.title = `BetterTIA Editor — edit ${u.id}`;
  let left = await loadTree(u.id);
  try {
    const b = await api(`/api/block?project=${enc(u.project)}&block=${enc(u.block)}`);
    left += networksHtml(b, u.kind === 'new_network' ? u.after_nw : u.nw, n => `?project=${enc(u.project)}&block=${enc(u.block)}&nw=${n}`);
  } catch (e) { /* block not in the export */ }
  $('nw').innerHTML = left;
  document.querySelector('.main').classList.add('edit');
  palette();
  operands();
  $('content').innerHTML = `<div class="edit-head">` +
    editTitleHtml(u) +
    `<div class="header"><span class="state s-Proposal">Proposal</span><span id="ed-mark"></span> round <b>${esc(u.round)}</b> · editing</div>` +
    `<div class="tools" style="margin:0">` +
    `<button id="ed-undo" title="Ctrl+Z">↶ Undo</button><button id="ed-redo" title="Ctrl+Y">↷ Redo</button><span class="sep"></span>` +
    (fbd ? `<button id="ed-plus" title="Insert input (Ctrl+Shift+3 in TIA)">+ input</button><button id="ed-minus" title="removes the selected (otherwise the last) input">− input</button>` +
           `<button id="ed-neg" title="Create a ones complement (Ctrl+Shift+4 in TIA)">Negate input</button>`
         : `<button id="ed-branch" title="pick two places in one rung; element = the one selected in the palette, otherwise an NO contact">Branch</button>`) +
    `<button id="ed-delete" title="Delete">Delete</button><span class="sep"></span>` +
    `<button id="ed-save" class="hl">Save proposal</button><button id="ed-close">Close editor</button></div>` +
    `<div class="tools" style="margin:0"><label>Title <input id="ed-title" class="wide" value="${esc(u.kind === 'new_network' ? u.title : u.title_after || u.title || '')}"></label>` +
    `<label>Comment <input id="ed-comment" class="wide" value="${esc(u.kind === 'new_network' ? u.comment || '' : u.comment_after || u.comment_before || '')}"></label>` +
    `<span class="hint">set after the import (Writer SetNetworkText)</span></div></div>` +
    `<div class="mode" id="ed-mode"></div>` +
    `<div class="canvas" id="ed-canvas"></div>` +
    `<div class="legend" style="margin-top:var(--s2)">Against the export: <span class="p">added</span><span class="z">changed</span><span class="s">deleted</span><span class="e">rule error</span></div>` +
    `<div class="editor-bottom"><div><h3>${LANG()} rules${ed.f ? ' · F-block' : ''}</h3><div class="errors" id="ed-errors"></div></div>` +
    `<div><h3>Element properties</h3><div class="properties" id="ed-properties"></div></div></div>`;
  $('ed-undo').onclick = undo;
  $('ed-redo').onclick = redo;
  if ($('ed-branch')) $('ed-branch').onclick = () => { ed.branch = ed.branch ? null : {from: null}; render(); };
  if (fbd) {
    $('ed-plus').onclick = () => ed.select && applyOp({type: 'add_input', id: ed.select});
    $('ed-minus').onclick = () => {
      const p = ed.after.elements.find(x => x.id === ed.select);
      if (p) applyOp({type: 'remove_input', id: p.id, input: ed.input || p.inputs.length});
    };
    $('ed-neg').onclick = () => ed.select && applyOp({type: 'negate', id: ed.select, input: ed.input || 1});
  }
  $('ed-delete').onclick = () => { if (ed.select) deleteSelected(); };
  $('ed-save').onclick = save;
  for (const i of ['ed-title', 'ed-comment']) $(i).oninput = () => { ed.changed = true; };
  $('ed-close').onclick = () => {
    if (!ed.changed || confirm('Unsaved changes will be lost. Close?')) location.href = `?edit=${enc(u.id)}`;
  };
  const pl = $('ed-canvas');
  pl.addEventListener('dragover', e => { if (ed.insert) { e.preventDefault(); highlightNear(nearest(e)); } });
  pl.addEventListener('dragleave', () => highlightNear(null));
  pl.addEventListener('drop', e => { e.preventDefault(); const m = nearest(e); if (m) insertAt(m); });
  document.addEventListener('keydown', keys);
  await recompute([]);
  // scenarios for screenshots / automation (headless has no mouse): &ops=<JSON operations>, &select=<id>, &palette=<key>, &branch=r,k
  if (q.get('ops')) await recompute(JSON.parse(q.get('ops')));
  if (q.get('select')) { ed.select = q.get('select'); ed.input = q.get('input') ? +q.get('input') : null; render(); }
  if (q.get('palette')) selectPalette(q.get('palette'));
  if (q.get('branch')) { const [r, k] = q.get('branch').split(',').map(Number); ed.branch = {from: {r, k}}; render(); }
}

async function recompute(ops, noHistory) {
  const res = await api('/api/layout', 'POST', {project: ed.u.project, before: ed.before, after: ed.after, ops, f: ed.f, width: canvasWidth()});
  if (ops.length && !noHistory) { ed.hist.push(ed.after); ed.redo = []; ed.changed = true; }
  if (ops.length) mode('');
  ed.after = res.after;
  ed.res = res;
  if (ed.select && !res.after.elements.some(p => p.id === ed.select)) ed.select = null;
  render();
  return res;
}
async function applyOp(op) {
  try { return await recompute([op]); }
  catch (e) { mode('⚠ ' + e.message); }
}
async function undo() {
  if (!ed.hist.length) return;
  ed.redo.push(ed.after); ed.after = ed.hist.pop(); ed.changed = true;
  await recompute([]);
}
async function redo() {
  if (!ed.redo.length) return;
  ed.hist.push(ed.after); ed.after = ed.redo.pop(); ed.changed = true;
  await recompute([]);
}
async function deleteSelected() {
  const id = ed.select;
  ed.select = null;
  await applyOp({type: 'delete', id});
}
async function save() {
  try {
    const texts = ed.u.kind === 'new_network' ? {title: $('ed-title').value, comment: $('ed-comment').value}
                                              : {title_after: $('ed-title').value, comment_after: $('ed-comment').value};
    const r = await api(`/api/edits/${enc(ed.u.id)}/after`, 'POST', Object.assign({after: ed.after}, texts));
    ed.changed = false;
    mode(`Saved ${new Date().toLocaleTimeString()}` + (r.errors.length ? ` — ${errorCount(r.errors.length, LANG())} (flagged in the edit header)` : ' — no errors'), true);
  } catch (e) { mode('⚠ Save failed: ' + e.message); }
}
function mode(text, message) {
  const r = $('ed-mode');
  if (!r) return;
  r.textContent = text || '';
  r.classList.toggle('message', !!message);
}
function keys(e) {
  const inField = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName);
  if (e.key === 'Escape') {
    if (inField) { document.activeElement.blur(); return; }
    if (ed.insert || ed.branch) { ed.insert = null; ed.branch = null; markPalette(); render(); }
    else if (ed.select) { ed.select = null; render(); }
    return;
  }
  if (inField) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && ed.select) { e.preventDefault(); deleteSelected(); }
}

// palette: instructions + project blocks, search by name
function palette() {
  const p = $('palette');
  p.hidden = false;
  p.innerHTML = `<h2>Palette</h2><input id="pal-search" type="search" aria-label="search the palette" placeholder="Search: TON, MOVE, FB_…" autocomplete="off"><div id="pal-list"></div>`;
  $('pal-search').oninput = paletteList;
  paletteList();
}
function paletteList() {
  const h = ($('pal-search').value || '').trim().toLowerCase();
  const sk = new Map();
  const source = ed.fbd ? ed.cat.fbd.concat(ed.cat.instruction.filter(x => x.element.type === 'box' && !/_TRIG$/.test(x.key)))
                       : ed.cat.instruction;
  for (const x of source) { if (!sk.has(x.group)) sk.set(x.group, []); sk.get(x.group).push(x); }
  sk.set('Project blocks', ed.cat.blocks.map(b => ({key: b.key, name: b.name, description: `${b.f ? 'F-' : ''}${b.kind}${b.number ?? ''}` +
          (b.instance.length ? ' · ' + b.instance.join(', ') : '')})));
  let html = '';
  for (const [group, item] of sk) {
    const f = item.filter(x => !h || (x.key + ' ' + x.name + ' ' + (x.description || '')).toLowerCase().includes(h));
    if (!f.length) continue;
    html += `<h2>${esc(group)}</h2>` + f.map(x => `<div class="item" draggable="true" data-key="${esc(x.key)}" title="${esc(x.description || '')}">` +
      glyph(x.element) + `<b>${esc(x.name)}</b><span>${esc(x.description || '')}</span></div>`).join('');
  }
  $('pal-list').innerHTML = html || '<p class="empty">Nothing matches — try an instruction (TON) or a block name.</p>';
  for (const el of $('pal-list').querySelectorAll('.item')) {
    el.onclick = () => selectPalette(ed.insert && ed.insert.key === el.dataset.key ? null : el.dataset.key);
    el.ondragstart = e => { e.dataTransfer.setData('text/plain', el.dataset.key); selectPalette(el.dataset.key); };
  }
  markPalette();
}
// small symbol preview for a palette item: contact, coil or box (project blocks have no element -> box)
function glyph(e) {
  const t = (e && e.type) || 'box', T = {contact_nc: '/', contact_p: 'P', contact_n: 'N', coil_s: 'S', coil_r: 'R', coil_neg: '/'}[t];
  const mark = T ? (T === '/' ? '<path d="M11 13l6-10"/>' : `<text x="14" y="11" text-anchor="middle">${T}</text>`) : '';
  const body = /^contact/.test(t) ? '<path d="M0 8h10M18 8h10M10 2v12M18 2v12"/>' + mark
    : /^coil|^ret$/.test(t) ? '<path d="M0 8h9M19 8h9M11 2a8 8 0 0 0 0 12M17 2a8 8 0 0 1 0 12"/>' + mark
    : '<rect x="6" y="1" width="16" height="14" rx="1.5"/><path d="M0 5h6M0 11h6M22 8h6"/>';
  return `<svg class="glyph" viewBox="0 0 28 16" aria-hidden="true">${body}</svg>`;
}
function markPalette() {
  for (const el of document.querySelectorAll('#palette .item')) {
    const active = !!ed.insert && el.dataset.key === ed.insert.key;
    el.classList.toggle('active', active);
    if (active) el.scrollIntoView({block: 'nearest'});
  }
}
function template(key) {
  const x = (ed.fbd ? ed.cat.fbd.find(i => i.key === key) : null) || ed.cat.instruction.find(i => i.key === key) ||
            ed.cat.blocks.find(b => b.key === key);
  const pr = x ? JSON.parse(JSON.stringify(x.element)) : null;
  if (pr && ed.fbd && !pr.name) pr.name = x.name;          // only for the mode text; FBD inserts by key
  return pr;
}
function selectPalette(key) {
  const element = key ? template(key) : null;
  ed.insert = element ? {key, element, kind: KIND(element)} : null;
  markPalette();
  render();
}
// operand suggestions: tags, global DB members, variables of the edited block (#…), instance DBs
function operands() {
  const o = [];
  for (const t of ed.cat.tags) o.push([`"${t.name}"`, `${t.type} ${t.address}`]);
  for (const d of ed.cat.db) {
    if (d.instance_type) o.push([`"${d.name}"`, `instance ${d.instance_type}`]);
    for (const c of d.members) o.push([`"${d.name}".${c.name}`, c.type]);
  }
  const block = ed.cat.blocks.find(b => b.name === ed.u.block);
  if (block) for (const [sec, field] of Object.entries(block.interface)) for (const v of field) o.push([`#${v.name}`, `${v.type} (${sec})`]);
  $('operands').innerHTML = o.map(([v, l]) => `<option value="${esc(v)}" label="${esc(l)}"></option>`).join('');
}

// insertion places: those valid for the selected palette element; in branch mode all (start) / after the start in the same rung (end)
function visiblePlaces() {
  const m = ed.res.places || [];
  if (ed.branch) return ed.branch.from ? m.filter(x => x.r === ed.branch.from.r && x.k > ed.branch.from.k) : m;
  if (ed.insert) return m.filter(x => x[ed.insert.kind]);
  return [];
}
function nearest(e) {
  const svg = $('ed-canvas').querySelector('svg');
  if (!svg) return null;
  const b = svg.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
  let best = null, dist = 45;
  for (const m of visiblePlaces()) {
    const d = Math.hypot(m.x - x, m.y - y);
    if (d < dist) { dist = d; best = m; }
  }
  return best;
}
function highlightNear(m) {
  const i = visiblePlaces().indexOf(m);
  for (const c of document.querySelectorAll('#ed-canvas .place')) c.classList.toggle('near', +c.dataset.i === i);
}
async function insertAt(m) {
  if (ed.branch) {
    if (!ed.branch.from) { ed.branch.from = {r: m.r, k: m.k}; render(); return; }
    const element = ed.insert ? ed.insert.element : template('NO');
    const start = ed.branch.from;
    ed.branch = null; ed.insert = null; markPalette();
    const res = await applyOp({type: 'branch', from: start, to: {r: m.r, k: m.k}, element});
    if (res && res.last) { ed.select = res.last; render(); }
    return;
  }
  if (!ed.insert) return;
  const element = ed.insert.element, key = ed.insert.key;
  ed.insert = null; markPalette();
  const res = await applyOp(ed.fbd ? {type: 'insert_box', element: key, to: m.to}
                                    : {type: 'insert', place: {r: m.r, k: m.k}, element});
  if (res && res.last) { ed.select = res.last; render(); }
}

function render() {
  const res = ed.res, pl = $('ed-canvas');
  if (!res || !pl) return;
  pl.innerHTML = '';
  if (!res.drawing) { pl.appendChild(rungList(res)); }
  else {
    const svg = draw(res, res.diff);
    pl.appendChild(svg);
    const faulty = new Set(res.errors.map(c => c.id).filter(Boolean));
    for (const g of svg.querySelectorAll('g[data-id]')) {
      const id = g.dataset.id, bb = g.getBBox();
      const frame = (tr, o) => { const r = el(g, 'rect', {class: tr, x: bb.x - o, y: bb.y - o, width: bb.width + 2 * o, height: bb.height + 2 * o, rx: 3});
                               g.insertBefore(r, g.firstChild); };
      if (id.startsWith('x:')) continue;
      frame('hit', 4);
      if (faulty.has(id)) frame('frame-error', 5);
      if (id === ed.select) frame('frame-select', 7);
      g.onclick = ev => {
        ev.stopPropagation(); if (ed.insert || ed.branch) return;
        ed.input = ev.target.dataset && ev.target.dataset.n ? +ev.target.dataset.n : null;
        ed.select = id; render(); focusProperties();
      };
    }
    svg.onclick = () => { if (!ed.insert && !ed.branch && ed.select) { ed.select = null; render(); } };
    const gm = el(svg, 'g', {});
    visiblePlaces().forEach((m, i) => {
      const c = el(gm, 'circle', {class: 'place', cx: m.x, cy: m.y, r: 7, 'data-i': i});
      el(c, 'title', {}, m.fbd ? (m.to ? `box ${m.to.id}, ${m.new_input ? 'new ' : ''}input ${m.to.input}` : 'new logic path')
                               : `rung ${m.r + 1}, position ${m.k}`);
      c.onclick = ev => { ev.stopPropagation(); insertAt(m); };
    });
    if (ed.branch && ed.branch.from) {
      const a = (res.places || []).find(x => x.r === ed.branch.from.r && x.k === ed.branch.from.k);
      if (a) el(gm, 'circle', {class: 'place chosen', cx: a.x, cy: a.y, r: 7});
    }
  }
  // mode, errors, properties, buttons
  if (ed.fbd && ed.insert) mode(`Inserting: ${ed.insert.element.name || ed.insert.key} — click a box input (the box takes over its signal), below the last input (new input) or bottom left (new logic path). Esc cancels.`);
  else if (ed.branch) mode(ed.branch.from ? 'Branch: click the end of the section in the same rung (Esc cancels).'
                                  : `Branch${ed.insert ? ' with ' + ed.insert.element.name : ''}: click the start of the section (Esc cancels).`);
  else if (ed.insert) mode(`Inserting: ${ed.insert.element.name || ed.insert.key} — click a highlighted place or drag onto a wire (Esc cancels).`);
  else if (!$('ed-mode').classList.contains('message')) mode('');
  if ($('ed-branch')) $('ed-branch').classList.toggle('active', !!ed.branch);
  if (ed.fbd) {
    const p = ed.select && ed.after.elements.find(x => x.id === ed.select);
    const log = p && ['and', 'or', 'xor'].includes(p.type);
    $('ed-plus').disabled = !log; $('ed-minus').disabled = !log || p.inputs.length <= 2;
    $('ed-neg').disabled = !p || !p.inputs.length;
  }
  $('ed-undo').disabled = !ed.hist.length;
  $('ed-redo').disabled = !ed.redo.length;
  $('ed-delete').disabled = !ed.select;
  const nch = res.errors.filter(c => !c.warning).length;
  $('ed-mark').innerHTML = nch ? `<span class="mark-errors">⚠ ${errorCount(nch, LANG())}</span> ·` : '';
  $('ed-errors').innerHTML = res.errors.length
    ? res.errors.map(c => `<div data-id="${esc(c.id || '')}" class="${c.warning ? 'var' : ''}">⚠ ${esc(c.error)}</div>`).join('')
    : '<div class="ok">✓ No errors.</div>';
  for (const d of $('ed-errors').querySelectorAll('div[data-id]'))
    if (d.dataset.id) d.onclick = () => { ed.select = d.dataset.id; render(); };
  properties();
}

function propertiesFBD(v, p) {
  const T = {and: '&', or: '>=1', xor: 'x', assign: '=', s: 'S', r: 'R', sr: 'SR', rs: 'RS', ptrig: 'P_TRIG', ntrig: 'N_TRIG'};
  const P = Object.fromEntries(ed.after.elements.map(x => [x.id, x]));
  const inp = (attrs, value) => `<input ${attrs} value="${esc(value ?? '')}" list="operands" autocomplete="off">`;
  const neg = (attrs, on) => `<label title="negate (Ctrl+Shift+4 in TIA)" style="white-space:nowrap"><input type="checkbox" ${attrs} ${on ? 'checked' : ''} style="width:auto"> NOT</label>`;
  let h = `<table><colgroup><col style="width:96px"><col><col style="width:62px"></colgroup>` +
          `<tr class="section"><td colspan="3">${esc(p.id)} · ${esc(T[p.type] || p.name || p.type)}${p.instance ? ' ' + esc(p.instance) : ''}</td></tr>`;
  if (T[p.type] && 'operand' in p && !['and', 'or', 'xor'].includes(p.type))
    h += `<tr><td>${['ptrig', 'ntrig'].includes(p.type) ? 'edge bit' : 'operand'}</td><td colspan="2">${inp('data-op="above"', p.operand)}</td></tr>`;
  if (p.type === 'call' && p.instance != null) h += `<tr><td>instance</td><td colspan="2">${inp('data-op="above"', p.instance)}</td></tr>`;
  if (p.inputs.length) h += `<tr class="section"><td colspan="3">Inputs</td></tr>`;
  for (const x of p.inputs) {
    const source = x.signal ? `<span style="color:var(--muted)">← output ${esc(T[(P[x.signal] || {}).type] || (P[x.signal] || {}).name || x.signal)} (${esc(x.signal)})</span>`
                           : inp(`data-input="${x.n}"`, x.operand);
    h += `<tr${ed.input === x.n ? ' style="background:var(--select)"' : ''}><td>${esc(x.pin)}${['and', 'or', 'xor'].includes(p.type) ? '' : ''}</td><td>${source}</td><td>${neg(`data-neg="${x.n}"`, x.neg)}</td></tr>`;
  }
  if (p.outputs.length) h += `<tr class="section"><td colspan="3">Outputs</td></tr>`;
  for (const x of p.outputs) h += `<tr><td>${esc(x.pin)}</td><td>${inp(`data-output="${esc(x.pin)}"`, x.operand)}</td><td>${neg(`data-negv="${esc(x.pin)}"`, x.neg)}</td></tr>`;
  h += `<tr><td>box output</td><td></td><td>${neg('data-negh="1"', p.neg_output)}</td></tr>`;
  v.innerHTML = h + '</table>';
  for (const i of v.querySelectorAll('[data-op]')) i.onchange = () => applyOp({type: 'change_operand', id: p.id, operand: i.value});
  for (const i of v.querySelectorAll('[data-input]')) i.onchange = () => applyOp({type: 'change_operand', id: p.id, input: +i.dataset.input, operand: i.value});
  for (const i of v.querySelectorAll('[data-output]')) i.onchange = () => applyOp({type: 'change_pin', id: p.id, pin: i.dataset.output, operand: i.value});
  for (const i of v.querySelectorAll('[data-neg]')) i.onchange = () => { ed.input = +i.dataset.neg; applyOp({type: 'negate', id: p.id, input: +i.dataset.neg}); };
  for (const i of v.querySelectorAll('[data-negv]')) i.onchange = () => applyOp({type: 'negate', id: p.id, output: i.dataset.negv});
  for (const i of v.querySelectorAll('[data-negh]')) i.onchange = () => applyOp({type: 'negate', id: p.id, output: 'main'});
}
function properties() {
  const v = $('ed-properties');
  const p = ed.select && ed.after.elements.find(x => x.id === ed.select);
  if (!p) { v.innerHTML = `<p class="comment">Click ${ed.fbd ? 'a box or one of its inputs' : 'an element'} on the canvas. Delete removes it, Ctrl+Z undoes.</p>`; return; }
  if (ed.fbd) { propertiesFBD(v, p); return; }
  const field = (key, value, description, list) => `<tr><td>${esc(description)}</td><td><input data-field="${key}" value="${esc(value ?? '')}" list="${list || 'operands'}" autocomplete="off"></td></tr>`;
  let h = `<table><colgroup><col style="width:96px"><col></colgroup><tr class="section"><td colspan="2" title="${esc(elementDescription(p))}">${esc(p.id)} · ${esc(elementDescription(p))}</td></tr>`;
  if (p.type === 'box') {
    if (p.instance != null) {
      const b = ed.cat.blocks.find(x => x.name === p.name);
      h += field('instance', p.instance, 'instance', 'operands');
      if (b && b.instance.length) h += `<tr><td></td><td style="color:var(--muted);font-size:12px">instance ${esc(p.name)}: ${b.instance.map(esc).join(', ')}</td></tr>`;
    }
    if (p.template != null) h += field('template', p.template, 'type', '');
    if (p.below != null) h += field('below', p.below, 'edge bit');
    if (p.inputs.length) h += `<tr class="section"><td colspan="2">Inputs</td></tr>`;
    p.inputs.forEach((x, i) => {
      h += x.operand.startsWith('wire#') ? `<tr><td>${esc(x.pin)}</td><td style="color:var(--muted)">← fed by branch ${esc(x.operand.slice(5))}</td></tr>`
                                         : `<tr><td>${esc(x.pin)}</td><td><input data-pin="inputs:${i}" value="${esc(x.operand)}" list="operands" autocomplete="off"></td></tr>`;
    });
    if (p.outputs.length) h += `<tr class="section"><td colspan="2">Outputs</td></tr>`;
    p.outputs.forEach((x, i) => { h += `<tr><td>${esc(x.pin)}</td><td><input data-pin="outputs:${i}" value="${esc(x.operand)}" list="operands" autocomplete="off"></td></tr>`; });
  } else if (p.type === 'comparison') {
    h += field('in1', p.in1, 'IN1');
    h += `<tr><td>op</td><td><select data-field="op">${['==', '<>', '>', '>=', '<', '<='].map(o => `<option ${o === p.op ? 'selected' : ''}>${o}</option>`).join('')}</select></td></tr>`;
    h += field('in2', p.in2, 'IN2') + field('template', p.template, 'type', '');
  } else if (p.type !== 'not') {
    h += field('operand', p.operand, 'operand');
    if (p.type === 'contact_p' || p.type === 'contact_n') h += field('bit', p.bit, 'edge bit');
  }
  v.innerHTML = h + '</table>';
  for (const i of v.querySelectorAll('[data-field]')) i.onchange = () => applyOp({type: 'change', id: p.id, values: {[i.dataset.field]: i.value}});
  for (const i of v.querySelectorAll('[data-pin]')) i.onchange = () => {
    const [str, idx] = i.dataset.pin.split(':');
    const pins = p[str].map(x => ({pin: x.pin, operand: x.operand}));
    pins[+idx].operand = i.value.trim();
    applyOp({type: 'change', id: p.id, values: {[str]: pins}});
  };
}
function focusProperties() {
  const i = (ed.input && $('ed-properties').querySelector(`input[data-input="${ed.input}"]`)) || $('ed-properties').querySelector('input');
  if (i) { i.focus(); i.select(); }
}

// ---------- status bar (all pages) ----------
let tiaStatus = {};
function statusHtml(st) {
  const chip = (cls, label, value, title) => `<span class="chip ${cls}" title="${esc(title || value)}">${label} <b>${esc(value)}</b></span>`;
  const tool = v => (v || 'missing').startsWith('error') ? 'bad' : v === 'configured' ? 'ok' : 'warn';
  let tia;
  const fake = st.demo ? ' (fake)' : '';
  $('demo-banner').innerHTML = st.demo ? '<span>DEMO — fake TIA, nothing is written to a real project</span>' : '';
  if (st.tia === 'attached') tia = chip(st.demo ? 'warn' : 'ok', 'TIA', `attached${fake} · ${st.project || '?'}`, st.project_path);
  else if (st.tia === 'running') tia = chip('warn', 'TIA', `running: ${st.project || '?'}`, st.project_path);
  else if (st.tia === 'not running') tia = chip('warn', 'TIA', 'not running', 'no TIA Portal instance — open your project in TIA Portal');
  else if (st.tia === 'choose') tia = chip('warn', 'TIA', `${st.instances.length} instances`) +
    `<select id="portal"><option value="">choose instance…</option>${st.instances.map(i =>
      `<option value="${esc(i.portalId)}">${esc(i.project || '?')} (${esc(i.portalId)})</option>`).join('')}</select>`;
  else tia = chip('', 'TIA', st.checked === false ? 'not checked' : 'unknown');
  return tia + chip(tool(st.writer), 'Writer', (st.writer || '—') + (st.writer ? fake : '')) +
    chip(tool(st.reader), 'Reader', (st.reader || '—') + (st.reader ? fake : ''), st.reader_export_root ? `${st.reader} · Reader export root: ${st.reader_export_root}` : st.reader) +
    aiChip(st, chip) +
    `<button id="status-refresh" title="check TIA Portal, Writer and Reader again">${st.busy ? 'Busy…' : 'Refresh'}</button>`;
}
function aiChip(st, chip) {
  const cl = st.ai_clients || [];
  if (!cl.length) return chip('', 'AI', 'no client', 'no AI agent connected — see "Connect an AI agent" on the home page');
  return chip('ok', 'AI', `connected (${cl.map(c => c.name).join(', ')})`,
    cl.map(c => `${c.name} ${c.version || ''} · connected ${c.since} · last heartbeat ${c.last_seen}`).join(' | '));
}
async function loadStatus(refresh, portalId) {
  if (refresh) $('status').innerHTML = statusHtml(Object.assign({}, tiaStatus, {busy: true}));
  try {
    tiaStatus = refresh ? await api('/api/tia/status', 'POST', {portalId}) : await api('/api/tia/status');
  } catch (e) { tiaStatus = {tia: 'unknown', writer: 'error: ' + e.message}; }
  $('status').innerHTML = statusHtml(tiaStatus);
  $('status-refresh').onclick = () => loadStatus(true).then(statusChanged);
  if ($('portal')) $('portal').onchange = e => e.target.value && loadStatus(true, e.target.value).then(statusChanged);
  return tiaStatus;
}
let statusChanged = () => {};

// ---------- home page ----------
const JOB_TEXT = {running: 'snapshot running', done: 'snapshot done', error: 'snapshot failed'};
function jobHtml(j, retry) {
  if (!j) return '';
  let h = `<div class="job ${esc(j.state)}" data-job="${esc(j.id)}"><span class="head">${JOB_TEXT[j.state] || esc(j.state)}</span>` +
    ` · ${j.chunks} chunk(s), ${j.exported} item(s) exported` + (j.plc ? ` · ${esc(j.plc.softwarePath)}` : '') +
    (j.result ? ` · export <b>${esc(j.result.export_ts)}</b>` : '') + `<ol>` +
    j.steps.map(s => `<li class="${s.ok ? '' : 'bad'}">${esc(s.step)}${s.ok ? '' : ': ' + esc(s.message)}</li>`).join('') +
    (j.state === 'running' ? '<li>…</li>' : '') + '</ol>';
  if (j.error) h += `<div class="err">⚠ ${esc(j.error)}</div><div class="fix">Fix the cause above and start the snapshot again; existing exports are not touched.</div>`;
  if (j.state === 'error' && j.plc_choices && j.plc_choices.length)
    h += `<div class="row">PLC: ${j.plc_choices.map(p => `<button data-retry="${esc(retry)}" data-sp="${esc(p.softwarePath)}">${esc(p.softwarePath)}</button>`).join('')}</div>`;
  return h + '</div>';
}
function cardHtml(p) {
  const edits = Object.entries(p.edits || {});
  const running = p.job && p.job.state === 'running';
  return `<div class="card"><h3><a href="?project=${enc(p.name)}">${esc(p.name)}</a><span class="src" title="how the project was added">${esc(p.source)}</span></h3>` +
    `<dl><dt>Last snapshot</dt><dd><b>${esc(p.last_snapshot || p.latest_export || '—')}</b> · ${p.exports} export${p.exports === 1 ? '' : 's'} · ` +
    `<a href="?project=${enc(p.name)}&view=changelog" title="what changed in the project and when">changelog</a></dd>` +
    (p.tia ? `<dt>PLC</dt><dd>${esc(p.tia.softwarePath)}</dd>` : '') +
    `<dt>Exports</dt><dd class="path" title="export root">${esc(p.export_root || '')}</dd>` +
    (p.project_path ? `<dt>TIA project</dt><dd class="path">${esc(p.project_path)}</dd>` : '') + `</dl>` +
    `<div class="edits">${edits.length ? edits.map(([s, n]) => `<span class="state s-${esc(s)}">${esc(s)} ${n}</span>`).join('') : 'No edits yet'}</div>` +
    `<div class="row"><button class="primary" data-open="${esc(p.name)}">Open</button>` +
    `<button data-snap="${esc(p.name)}" ${running ? 'disabled' : ''} title="export the whole PLC from TIA Portal through the Reader">New snapshot</button>` +
    `<button data-remove="${esc(p.name)}" ${running ? 'disabled' : ''} title="remove from the list (exports and edits stay on disk)">Remove</button></div>` +
    jobHtml(p.job, p.name) + '</div>';
}
function addHtml() {
  const t = tiaStatus.tia === 'attached' ? `TIA Portal has <b>${esc(tiaStatus.project || '?')}</b> open.` :
    tiaStatus.tia === 'not running' ? 'TIA Portal is not running — open the project in TIA Portal first.' :
    tiaStatus.tia === 'choose' ? 'More TIA Portal instances are running — choose one in the status bar.' : 'TIA status not checked yet — press Refresh in the status bar.';
  return `<section><h2>Add a project</h2><p class="lead">Edits are drawn from a snapshot — a Reader export of the PLC.</p><div class="add">
  <div class="opt"><div><b>Export folder</b><span>a Reader export already on disk</span></div>
    <div class="line"><input type="text" id="add-path" aria-label="export folder" placeholder="&lt;project&gt; folder with &lt;YYYYMMDD-HHMMSS&gt; subfolders, or an export root">` +
    `<button id="add-exports">Add</button></div></div>
  <div class="opt"><div><b>Project open in TIA Portal</b><span>${t}</span></div>
    <div class="line"><button id="add-tia" class="primary">Connect and take snapshot</button></div></div>
  <div class="opt"><div><b>.ap21 project file</b><span>TIA Portal opens it, then a snapshot is taken</span></div>
    <div class="line"><input type="text" id="add-ap21" aria-label=".ap21 file" placeholder="full path of the .ap21 project (or .als21 session)"></div>` +
    `<div class="line"><label><input type="checkbox" id="add-close"> close the project afterwards</label><button id="add-open">Open and take snapshot</button></div>` +
    `<div class="note">⚠ This may start TIA Portal and take several minutes.</div></div>
  <div id="add-job"></div><div id="add-error"></div>
</div></section>`;
}
function aiHtml() {
  const server = location.origin;
  const cfg = JSON.stringify({mcpServers: {'bettertia-editor': {command: 'python', args: ['mcp_server.py', '--server', server]}}}, null, 2);
  const items = [['Claude Code or Cursor', '.mcp.json in the project folder (Cursor: .cursor/mcp.json)', cfg],
                 ['Any MCP client', 'stdio command', `python mcp_server.py --server ${server}`]];
  const ai = (tiaStatus.ai_clients || []).map(c => c.name);
  return `<section><h2>Connect an AI agent</h2><p class="lead">${ai.length ? `<span class="chip ok">AI <b>connected (${esc(ai.join(', '))})</b></span><br>` : ''}` +
    `The agent reads networks, proposes edits and checks exports. Approving and writing to TIA Portal stay with you.</p><div class="add ai">` +
    items.map(([t, sub, text], i) => `<div class="opt"><div><b>${t}</b><span>${sub}</span></div>` +
    `<div class="code"><pre id="ai-cfg-${i}">${esc(text)}</pre><button data-copy="${i}" aria-label="copy ${t} configuration">Copy</button></div></div>`).join('') +
    `<div class="hint">Use the full path of this repository's <code>mcp_server.py</code> when the client starts in another folder.</div></div></section>`;
}
function emptyHtml() {
  return `<div class="empty-state"><svg width="96" height="72" viewBox="0 0 96 72" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">` +
    `<path d="M8 6v60M8 24h18M38 24h12M70 24h18M26 14v20M38 14v20M8 52h30"/>` +
    `<path d="M56 14a12 12 0 0 0 0 20M64 14a12 12 0 0 1 0 20"/>` +
    `<path d="M44 52h22" stroke-dasharray="4 5" opacity=".6"/><circle cx="76" cy="52" r="6" opacity=".6"/></svg>` +
    `<div><b>No projects yet</b><p>Add a Reader export or connect to the project open in TIA Portal. ` +
    `Then propose a change to a network and move it through review.</p>` +
    `<ol><li>Add a project</li><li>Propose</li><li>Approve</li></ol></div></div>`;
}
function connectionHtml() {
  const miss = [['Writer', tiaStatus.writer], ['Reader', tiaStatus.reader]].filter(([, v]) => v && v !== 'configured');
  if (!miss.length) return '';
  return `<div class="warning"><b>⚠ ${miss.map(([n, v]) => `${n}: ${esc(v)}`).join(' · ')}</b><br>` +
    `Viewing and editing work without them; snapshots, Upload and Check need both. Start the server with ` +
    `<code>--mcp-json</code> (or <code>--writer-cmd</code> / <code>--reader-cmd</code>) and press Refresh.</div>`;
}
let homeJob = null;
async function showHome() {
  document.querySelector('.main').classList.add('home');
  $('info').textContent = '';
  const r = await api('/api/projects');
  const flow = `<ol class="stepper flow" aria-label="workflow">${STATES.map(x => `<li class="s-${x} done"><span class="node"></span>${x}</li>`).join('')}</ol>`;
  let h = `<div class="home"><div class="hero"><h1>Review AI-proposed changes to TIA Portal networks</h1>` +
    `<p>An AI agent proposes a change to one LAD or FBD network. You see the diff drawn as in TIA Portal, approve it, ` +
    `and follow it until it is in the project and tested.</p>${flow}</div>` + connectionHtml();
  h += `<h2>Projects</h2>` + (r.projects.length ? `<div class="cards">${r.projects.map(cardHtml).join('')}</div>` : emptyHtml());
  h += `<div class="duo" style="margin-top:var(--s5)">${addHtml()}${aiHtml()}</div></div>`;
  $('content').innerHTML = h;
  const job = homeJob || (r.running_job && !r.running_job.project ? r.running_job : null);
  if (job) $('add-job').innerHTML = jobHtml(job, '');
  for (const b of document.querySelectorAll('[data-copy]')) b.onclick = async () => {
    try { await navigator.clipboard.writeText($('ai-cfg-' + b.dataset.copy).textContent); b.textContent = 'Copied'; }
    catch (e) { b.textContent = 'Cannot copy'; }
  };
  for (const b of document.querySelectorAll('[data-open]')) b.onclick = () => { location.href = `?project=${enc(b.dataset.open)}`; };
  const fail = e => { $('add-error').innerHTML = `<div class="warning">⚠ ${esc(e.message)}</div>`; };
  $('add-exports').onclick = () => api('/api/projects', 'POST', {source: 'exports', path: $('add-path').value}).then(showHome, fail);
  $('add-tia').onclick = () => startJob('/api/projects', {source: 'tia'}).catch(fail);
  $('add-open').onclick = () => startJob('/api/projects', {source: 'ap21', path: $('add-ap21').value, close: $('add-close').checked}).catch(fail);
  for (const b of document.querySelectorAll('[data-snap]')) b.onclick = () => startJob(`/api/projects/${enc(b.dataset.snap)}/snapshot`, {}).catch(fail);
  for (const b of document.querySelectorAll('[data-remove]')) b.onclick = () => {
    if (confirm(`Remove ${b.dataset.remove} from the list? Its exports and edits stay on disk.`))
      api(`/api/projects/${enc(b.dataset.remove)}`, 'DELETE').then(showHome, fail);
  };
  for (const b of document.querySelectorAll('[data-sp]')) b.onclick = () => (b.dataset.retry
    ? startJob(`/api/projects/${enc(b.dataset.retry)}/snapshot`, {softwarePath: b.dataset.sp})
    : startJob('/api/projects', Object.assign({source: 'tia'}, homeJob && homeJob.request, {softwarePath: b.dataset.sp}))).catch(fail);
  const running = [...r.projects.map(p => p.job), job].find(j => j && j.state === 'running');
  if (running) setTimeout(() => pollJob(running.id), 700);
}
async function startJob(path, body) {
  const r = await api(path, 'POST', body);
  if (path === '/api/projects') homeJob = Object.assign(r.job, {request: body});
  await showHome();
}
async function pollJob(id) {
  const j = await api(`/api/jobs/${enc(id)}`);
  if (homeJob && homeJob.id === id) homeJob = Object.assign(j, {request: homeJob.request});
  if (j.state === 'running') {
    const box = document.querySelector(`[data-job="${CSS.escape(id)}"]`);
    if (box) box.outerHTML = jobHtml(j, j.project || '');
    setTimeout(() => pollJob(id), 700);
  } else await showHome();
}

async function start() {
  $('theme').onclick = () => {
    const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem('tiac-theme', t); } catch (e) { /* private window: the choice lasts until reload */ }
  };
  if (q.get('screenshot') === '1') document.body.classList.add('screenshot');
  const project = q.get('project'), block = q.get('block');
  const status = loadStatus(false);
  if (q.get('edit') && q.get('edit_mode') === '1') await editor(q.get('edit'));
  else if (q.get('edit')) await showEdit(q.get('edit'));
  else if (q.get('group')) await showGroup(q.get('group'));
  else if (project && block) await showNetwork(project, block);
  else if (project && q.get('screen')) { $('nw').innerHTML = await loadTree(null); await showScreen(project, q.get('screen')); }
  else if (project) {
    $('nw').innerHTML = await loadTree(null);
    const view = q.get('view');
    await (view === 'changelog' ? showChangelog(project) : view === 'versions' ? showVersions(project)
           : view === 'hmi' ? showHmi(project) : showExports(project));
  }
  else {                                     // home: shown at once, the TIA check (autoconnect) re-renders it
    statusChanged = showHome;
    await status;
    await showHome();
    if (tiaStatus.autoconnect && q.get('screenshot') !== '1') { await loadStatus(true); await showHome(); }
  }
  await status;
  document.body.dataset.done = '1';
  if (q.get('screenshot') !== '1') setInterval(async () => {   // an AI agent connects / leaves -> update the chip
    try { if ((await api('/api/tia/status')).ai !== tiaStatus.ai) await loadStatus(false); } catch (e) {}
  }, 10000);
}
start().catch(e => {
  $('content').innerHTML = `<div class="notice"><b>This page could not load</b><span>${esc(e.message)}. ` +
    `Check that the server is running and the link is complete, then reload — or go back to <a href="/">Home</a>.</span></div>`;
  document.body.dataset.done = '1';
});
</script>
